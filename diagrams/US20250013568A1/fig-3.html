<ol aria-label="图中机制"><li><a href="#us20250013568a1-fig-3-lookup">查地址表</a> 查的是地址存在性及其模式关联。</li><li><a href="#us20250013568a1-fig-3-hit">地址表命中</a> 控制器返回与模式关联的值，数据阵列保持不读。</li><li><a href="#us20250013568a1-fig-3-activate">地址表未命中</a> 控制器启用存储阵列，按正常地址读。</li><li><a href="#us20250013568a1-fig-3-ret">返回阵列数据</a> 这条路径的逻辑读值由实际存储位置提供。</li></ol>
