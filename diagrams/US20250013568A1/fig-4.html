<p>用同一地址的两次写与两次读，确认切换后不会继续返回旧的背景模式。</p>

<text x="28" y="628" class="legend" text-anchor="start">数据更新与地址表更新表示本次逻辑写的组成动作。说明书未规定二者的内部周期顺序。</text>
</svg></div>
<figcaption>依据 US20250013568A1 原图 2、7、说明书 0039、0040、0071、0072、权利要求 22、23、26、29、30、33</figcaption>

<ol aria-label="图中机制"><li><a href="#us20250013568a1-fig-4-set">记录模式地址</a> 第一次写只设置地址表，数据阵列的原值可以暂存。</li><li><a href="#us20250013568a1-fig-4-data">写普通数据</a> 第二次写在模式比较后走常规写阵列。</li><li><a href="#us20250013568a1-fig-4-remove">移除模式记录</a> 说明书 ¶0039 明示地址被非模式值覆盖时退出地址表。</li><li><a href="#us20250013568a1-fig-4-later">读返回普通新值</a> 后续读查表不命中，从写好的阵列位置取得新数据。</li></ol>
