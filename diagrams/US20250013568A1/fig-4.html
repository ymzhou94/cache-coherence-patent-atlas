<p>用同一地址的两次写与两次读，确认切换后不会继续返回旧的背景模式。</p>

<ol aria-label="图中机制"><li><a href="#us20250013568a1-fig-4-set">记录模式地址</a><span>第一次写只设置地址表，数据阵列的原值可以暂存。</span></li><li><a href="#us20250013568a1-fig-4-data">写普通数据</a><span>第二次写在模式比较后走常规写阵列。</span></li><li><a href="#us20250013568a1-fig-4-remove">移除模式记录</a><span>说明书 ¶0039 明示地址被非模式值覆盖时退出地址表。</span></li><li><a href="#us20250013568a1-fig-4-later">读返回普通新值</a><span>后续读查表不命中，从写好的阵列位置取得新数据。</span></li></ol>
