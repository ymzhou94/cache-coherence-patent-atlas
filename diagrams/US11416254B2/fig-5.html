<h1>重复映射如何改变物理寄存器的回收资格</h1>
<p>在 X3 或 X7 中，仅移除一份指向 P11 的映射时，另一份仍能指向它。回收判定可查询重复映射跟踪结构。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="重复映射如何改变物理寄存器的回收资格"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 477" role="img" aria-labelledby="us11416254b2-fig-5-svg-title us11416254b2-fig-5-svg-desc">

<rect width="100%" height="100%" fill="#f5f5f5"/>
<path id="us11416254b2-fig-5-inspect" d="M 480 150 L 480 230" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us11416254b2-fig-5-arrow-data)"/>
<path id="us11416254b2-fig-5-keep" d="M 319 289 L 248 289" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us11416254b2-fig-5-arrow-main)"/>

<ol aria-label="图中机制"><li><a href="#us11416254b2-fig-5-candidate">产生物理寄存器回收候选</a><span>一般重命名的被覆盖物理寄存器在对应指令退休后成为回收候选。成为候选是进入检查，而非立刻重新分配。</span></li><li><a href="#us11416254b2-fig-5-dup">还有有效映射引用 P11？</a><span>原图 4 的旁路实施例让 X3 和 X7 共用 P11。说明书提出跟踪映射器里的重复映射。</span></li><li><a href="#us11416254b2-fig-5-hold">保留 P11</a><span>若仍存在有效映射，至少还要保留这份物理寄存器。</span></li><li><a href="#us11416254b2-fig-5-return">可进入空闲列表</a><span>没有其他映射时，重复映射这一项不再阻止回收。说明书未限定完整的空闲列表算法。</span></li></ol>
