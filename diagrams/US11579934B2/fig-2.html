<ol aria-label="图中机制"><li><a href="#us11579934b2-fig-2-lookup">按目标 cluster 映射得 A</a><span>第一运行点 A 来自控制量上限索引到该 cluster 的功率映射。</span></li><li><a href="#us11579934b2-fig-2-recommend">推荐同一 cluster 以 B 运行</a><span>第二运行点 B 随待执行线程的建议到来，比较对象仍是同一 cluster。</span></li><li><a href="#us11579934b2-fig-2-commit">设为 A</a><span>权利要求只对所述冲突动作给出约束。周期限值、异步限值与请求取最小值属于说明书实施例。</span></li></ol>
