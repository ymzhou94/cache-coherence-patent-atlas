<ol aria-label="图中机制"><li><a href="#us11442855b2-fig-1-space">阵列已满</a> 无空余位置时，转入逐出选择。</li><li><a href="#us11442855b2-fig-1-status">查询旧行模式状态</a> 检查已驻留内容的分类。</li><li><a href="#us11442855b2-fig-1-wb-estimate">writeback 条件独立确认</a> 可选策略还考虑是否写回以及写回能耗。</li><li><a href="#us11442855b2-fig-1-apply">指定哪个位置腾出</a> 新行随后利用选中的旧行槽位。</li></ol>
