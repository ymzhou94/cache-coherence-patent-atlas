<h1>抬腕触发先更新，显示随后提亮</h1>
<p>先于显示阶跃更新是段 0094 的变体。闭环报告和功率调整在阶跃后才可能进一步改变预算。</p>

<ol aria-label="图中机制"><li><a href="#us12608071b2-fig-2-trigger">显示即将增加负载</a><span>例子采用抬腕或即将升亮的预告；权利要求 9、13 描述会造成功率阶跃的动作。</span></li><li><a href="#us12608071b2-fig-2-deliver">下发新的显示预算</a><span>合成器给显示新预算，在此变体中预算先到，显示再按预算设置最大亮度。</span></li><li><a href="#us12608071b2-fig-2-measure">采样后更新闭环预算</a><span>发生阶跃后才有新实测功率。反馈侧要等采样、滤波及闭环调节。</span></li><li><a href="#us12608071b2-fig-2-trim">必要时进一步收紧</a><span>如果后续更新显示应进一步收紧，客户端接收新预算再改亮度。</span></li></ol>
