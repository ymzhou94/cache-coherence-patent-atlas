<ol aria-label="图中机制"><li><a href="#us12608071b2-fig-1-prediction">电池能力预测器</a> 电池能力预测器接收未来需求估计与当前电池状态。内阻、开路电压等可在预测窗口内变化。</li><li><a href="#us12608071b2-fig-1-closed">闭环控制器</a> 闭环控制器使用近期电池能力和实测功率，反馈调整仍会受到采样、滤波与客户端响应的延迟。</li><li><a href="#us12608071b2-fig-1-combine">预算合成器</a> 预算合成器按客户端接收两套预算；三项独立权要求加权求和。</li><li><a href="#us12608071b2-fig-1-client">客户端</a> 显示用亮度实现预算，扬声器可用音量，实际功率仍应在执行端观测。</li></ol>
