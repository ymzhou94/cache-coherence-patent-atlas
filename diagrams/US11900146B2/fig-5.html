<h1>实时截止点决定非实时请求能否先进入流水线</h1>
<p>同一批候选比较两种服务顺序。公共资源上先执行非实时请求是否可行取决于实时请求的剩余时间。</p>

<div class="diagram-container" tabindex="0" role="region" aria-label="实时截止点决定非实时请求能否先进入流水线"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="us11900146b2-fig-5-svg-title us11900146b2-fig-5-svg-desc">

<desc id="us11900146b2-fig-5-svg-desc">同一批候选比较两种服务顺序。公共资源上先执行非实时请求是否可行取决于实时请求的剩余时间。</desc>

<rect width="100%" height="100%" fill="#f5f5f5"/>
<g id="us11900146b2-fig-5-axis">
<line x1="192" y1="76" x2="192" y2="396" stroke="#4f5d75" opacity=".27"/>
<text x="192" y="64" class="arrow-label" text-anchor="middle">0</text>
<line x1="451.2" y1="76" x2="451.2" y2="396" stroke="#4f5d75" opacity=".27"/>

<figcaption>依据 US11900146B2 原图 1、2、4、说明书 0023、0032、0033、0059、权利要求 6、13、16、17</figcaption>

<ol aria-label="图中机制"><li><a href="#us11900146b2-fig-5-rt-first">实时先行</a> 本模型在周期 2 完成实时服务，早于截止点 4。</li><li><a href="#us11900146b2-fig-5-nrt-first">非实时先行</a> 推迟到周期 5 才完成实时请求。</li><li><a href="#us11900146b2-fig-5-limit">截止点</a> 模型独立设定。放宽到周期 5 时两种顺序均满足条件。</li></ol>
