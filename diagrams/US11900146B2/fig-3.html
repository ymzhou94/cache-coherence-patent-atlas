<ol aria-label="图中机制"><li><a href="#us11900146b2-fig-3-metadata">事务描述</a><span>请求描述独立参与表内选择和公共仲裁。</span></li><li><a href="#us11900146b2-fig-3-write-out">写获准才送出数据</a><span>对应数据从写数据缓冲读取，送往内存。</span></li><li><a href="#us11900146b2-fig-3-read-in">读数据缓冲</a><span>内存读回的数据可临时存在读返回数据缓冲。</span></li><li><a href="#us11900146b2-fig-3-read-out">返回正确请求方</a><span>部分实现可使已就绪的实时读数据先返回，遵守对应排序规则。</span></li></ol>
