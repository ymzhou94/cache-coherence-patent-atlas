<h1>分配轮次与温度、消费反馈的更新位置</h1>
<p>看同轮的测量、反馈与分配，再看何时重取系统总预算。横轴是轮次中的阶段。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="分配轮次与温度、消费反馈的更新位置"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" role="img" aria-labelledby="us12530063b2-fig-2-svg-title us12530063b2-fig-2-svg-desc">

<rect width="100%" height="100%" fill="#f5f5f5"/>

<line x1="408" y1="76" x2="408" y2="396" stroke="#4f5d75" opacity=".27"/>

<ol aria-label="图中机制"><li><a href="#us12530063b2-fig-2-thermal">热控外环</a><span>下一轮可以重新读取系统总预算。图中的回边允许只有消费端反馈更新。</span></li><li><a href="#us12530063b2-fig-2-consumer">消费反馈</a><span>消费者量测不同时间窗口的实际与允许功耗，并可以形成按窗派生的反馈。</span></li><li><a href="#us12530063b2-fig-2-allocation">分配控制</a><span>生产代理使用可用的系统预算和这一轮反馈再计算成员的部件上限。</span></li></ol>
