<ol aria-label="图中机制"><li><a href="#us12530063b2-fig-2-thermal">热控外环</a> 下一轮可以重新读取系统总预算。图中的回边允许只有消费端反馈更新。</li><li><a href="#us12530063b2-fig-2-consumer">消费反馈</a> 消费者量测不同时间窗口的实际与允许功耗，并可以形成按窗派生的反馈。</li><li><a href="#us12530063b2-fig-2-allocation">分配控制</a> 生产代理使用可用的系统预算和这一轮反馈再计算成员的部件上限。</li></ol>
