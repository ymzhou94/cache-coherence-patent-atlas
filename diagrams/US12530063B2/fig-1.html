<ol aria-label="图中机制"><li><a href="#us12530063b2-fig-1-thermal">闭环温度监视器</a> 温度监视器从设备内的实测温度估计可分配总预算，热边界由外环处理。</li><li><a href="#us12530063b2-fig-1-allocation">生产代理控制器</a> 生产代理读取总预算及来自多个消费代理的反馈，把预算拆成不同部件的份额。</li><li><a href="#us12530063b2-fig-1-feedback">消费端反馈</a> 消费端回报实测性能、实际功耗等派生指标。系统分配依据包含消费者与生产者间的处理速率关系。</li><li><a href="#us12530063b2-fig-1-control">各部件预算</a> 消费端按部件上限执行，例如用 DVFM 设置电压和频率。额度与实际功耗仍应分别测量。</li></ol>
