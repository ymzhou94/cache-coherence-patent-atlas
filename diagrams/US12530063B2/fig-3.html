<ol aria-label="图中机制"><li><a href="#us12530063b2-fig-3-performance">性能控制器</a><span>性能控制器比较消费端的实测性能与允许性能，产生可带正负号的性能分量。</span></li><li><a href="#us12530063b2-fig-3-power">功耗控制器</a><span>功耗控制器比较统计的实测功耗与部件允许功耗。</span></li><li><a href="#us12530063b2-fig-3-metric">复合消费者性能反馈</a><span>原图 4 可用性能分量减去功耗分量，组合结果再送生产端。不同反馈量保留各自观测口径。</span></li><li><a href="#us12530063b2-fig-3-adapt">动态分配器</a><span>动态分配器通过比较反馈和当前分配系数调整系数。在图 3 实施例中，选择器也可采用静态系数。</span></li><li><a href="#us12530063b2-fig-3-allocator">部件预算分配器</a><span>分配器以所选系数计算每个部件预算。举例可用总预算乘以对应份额。</span></li></ol>
