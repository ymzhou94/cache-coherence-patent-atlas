<ol aria-label="图中机制"><li><a href="#us11775811b2-fig-6-integration">集成阶段</a> 集成阶段提取参数和输出格式，也可从数据流确认先后顺序。</li><li><a href="#us11775811b2-fig-6-decl">运行时推理登记</a> 原图 5 的运行时代码可登记分割和特征点推理。图生成器用实际运行选择决定纳入哪些算法。</li><li><a href="#us11775811b2-fig-6-inputs">算法次序</a> 至少结合真实数据消费关系与时序需求，不能只把类型相同当成已有依赖。</li><li><a href="#us11775811b2-fig-6-graph">图生成器</a> 图生成器为每个算法创建节点，以边表示依赖。节点记载执行设备。</li><li><a href="#us11775811b2-fig-6-sched">异构调度器</a> 异构调度器从运行时 DAG 取候选，完成事件到达后重新评估。</li></ol>
