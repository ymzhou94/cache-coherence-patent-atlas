<ol aria-label="图中机制"><li><a href="#us12333339b2-fig-4-afixed">静态分派 A</a><span>A 静态有八批，分派结束于第 8 拍，最后一批在第 9 拍完成。</span></li><li><a href="#us12333339b2-fig-4-bfixed">静态分派 B</a><span>B 静态只处理初始三批。第 3 拍可继续分派但没有本组剩余份额，原最后一批第 4 拍完成。</span></li><li><a href="#us12333339b2-fig-4-adynamic">共享分派 A</a><span>共享条件触发后，A 由八批变为六批。仍由 A 组遍历器生成供给这两个组的批次。</span></li><li><a href="#us12333339b2-fig-4-bdynamic">共享分派 B</a><span>B 第 3 拍起分派 A 的两个批次。这个时点标记的是发完 B 原份额，不要求 B 的已发批次已执行完。</span></li></ol>
