<body><main>
<h1>首次需求命中预取行可只清预取位，下一次才提升</h1>
<p>预取标记和替换位置有各自的更新动作。原图 3 的一种规则先确认该行进入需求使用，再让后续需求命中给予普通提升。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="首次需求命中预取行可只清预取位，下一次才提升"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 613" role="img" aria-labelledby="fig-5-svg-title fig-5-svg-desc">
<title id="fig-5-svg-title">首次需求命中预取行可只清预取位，下一次才提升</title>
<desc id="fig-5-svg-desc">预取标记和替换位置有各自的更新动作。原图 3 的一种规则先确认该行进入需求使用，再让后续需求命中给予普通提升。</desc>
<defs><marker id="fig-5-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="fig-5-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-5-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="fig-5-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="116" y1="80" x2="116" y2="500" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="358" y1="80" x2="358" y2="500" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="601" y1="80" x2="601" y2="500" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="844" y1="80" x2="844" y2="500" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<g id="fig-5-prefetch"><path d="M 116 120 L 358 120" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#fig-5-arrow-data)"/><rect x="191.5" y="96" width="91" height="18" fill="#f5f5f5"/><text x="237" y="110" class="arrow-label" text-anchor="middle">非关键预取回填</text></g>
<g id="fig-5-alloc"><path d="M 358 168 L 601 168" fill="none" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#fig-5-arrow-control)"/><rect x="414.5" y="144" width="130" height="18" fill="#f5f5f5"/><text x="479.5" y="158" class="arrow-label" text-anchor="middle">安装缓存行，置预取位</text></g>
<g id="fig-5-near-lru"><path d="M 358 216 L 844 216" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#fig-5-arrow-data)"/><rect x="523" y="192" width="156" height="18" fill="#f5f5f5"/><text x="601" y="206" class="arrow-label" text-anchor="middle">选择靠近 LRU 的位置</text></g>
<g id="fig-5-first"><path d="M 116 264 L 358 264" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#fig-5-arrow-main)"/><rect x="191.5" y="240" width="91" height="18" fill="#f5f5f5"/><text x="237" y="254" class="arrow-label" text-anchor="middle">第一次需求命中</text></g>
<g id="fig-5-clear"><path d="M 358 312 L 601 312" fill="none" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#fig-5-arrow-control)"/><rect x="447" y="288" width="65" height="18" fill="#f5f5f5"/><text x="479.5" y="302" class="arrow-label" text-anchor="middle">清除预取位</text></g>
<g id="fig-5-remain"><path d="M 358 360 L 844 360" fill="none" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#fig-5-arrow-control)"/><rect x="575" y="336" width="52" height="18" fill="#f5f5f5"/><text x="601" y="350" class="arrow-label" text-anchor="middle">位置保持</text></g>
<g id="fig-5-again"><path d="M 116 408 L 358 408" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#fig-5-arrow-main)"/><rect x="185" y="384" width="104" height="18" fill="#f5f5f5"/><text x="237" y="398" class="arrow-label" text-anchor="middle">后续需求再次命中</text></g>
<g id="fig-5-promote"><path d="M 358 456 L 844 456" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#fig-5-arrow-data)"/><rect x="523" y="432" width="156" height="18" fill="#f5f5f5"/><text x="601" y="446" class="arrow-label" text-anchor="middle">按需求规则提升到 MRU</text></g>
<rect x="28" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="116" y="63" class="node-name" text-anchor="middle">需求／预取访问</text>
<rect x="270" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="358" y="63" class="node-name" text-anchor="middle">缓存控制</text>
<rect x="513" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="601" y="63" class="node-name" text-anchor="middle">标签与预取位</text>
<rect x="756" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="844" y="63" class="node-name" text-anchor="middle">组内替换状态</text>
<text x="28" y="532" class="legend" text-anchor="start">这是一种二分类命中更新的实施例。多级关键性还可影响提升位置。</text>
</svg></div>
<figcaption>依据 US11822480B2 原图 1、3、说明书 0028、0045、0046、0047、权利要求 1、9、11、12、15</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#fig-5-alloc">预取先分配并留标记</a> 示例非关键预取靠近 LRU。标签上的预取位标记来源。</li><li><a href="#fig-5-first">第一次需求命中</a> 按图 3 的更新规则，数据照常供给。清除预取位并保持替换位置。</li><li><a href="#fig-5-again">之后处理为需求命中</a> 当再次命中且该行从预取状态转出，可按普通需求更新到 MRU。</li></ol>

</main></body>
</html>
