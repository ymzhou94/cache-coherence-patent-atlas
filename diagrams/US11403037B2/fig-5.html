<h1>写队列占用跨过门限时，才抽取本轮写请求</h1>
<p>对照达到门限和未达到门限的行为，区分何时抽取、抽取多少。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="写队列占用跨过门限时，才抽取本轮写请求"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 586" role="img" aria-labelledby="us11403037b2-fig-5-svg-title us11403037b2-fig-5-svg-desc">
<title id="us11403037b2-fig-5-svg-title">写队列占用跨过门限时，才抽取本轮写请求</title>
<desc id="us11403037b2-fig-5-svg-desc">对照达到门限和未达到门限的行为，区分何时抽取、抽取多少。</desc>
<defs><marker id="us11403037b2-fig-5-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="us11403037b2-fig-5-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="us11403037b2-fig-5-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="us11403037b2-fig-5-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path id="us11403037b2-fig-5-pending" d="M 231 170 L 350 170" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us11403037b2-fig-5-arrow-data)"/>
<path id="us11403037b2-fig-5-enough" d="M 568 170 L 710 170" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us11403037b2-fig-5-arrow-main)"/>
<path id="us11403037b2-fig-5-not-enough" d="M 459 226 L 459 437 Q 459 445 467 445 L 711 445" fill="none" stroke="#2e5aa8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#us11403037b2-fig-5-arrow-control)"/>

<g id="us11403037b2-fig-5-cmp"><polygon points="459,114 568,170 459,226 350,170" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><text x="459" y="167" class="node-name" text-anchor="middle">达到写队列门限？</text><text x="459" y="188" class="node-detail" text-anchor="middle">比较当前占用</text></g>
<g id="us11403037b2-fig-5-yes"><rect x="710" y="112" width="212" height="113" rx="6" fill="#f5f5f5"/><rect x="710" y="112" width="212" height="113" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><text x="816" y="138" class="node-name" text-anchor="middle">抽取本轮写请求</text><text x="816" y="160" class="node-detail" text-anchor="middle">数量由效率策略计算</text><text x="816" y="178" class="node-detail" text-anchor="middle">可小于队列存量</text></g>

<g id="us11403037b2-fig-5-policy"><rect x="39" y="393" width="211" height="113" rx="6" fill="#f5f5f5"/><rect x="39" y="393" width="211" height="113" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="144.5" y="419" class="node-name" text-anchor="middle">访问效率反馈</text><text x="144.5" y="441" class="node-detail" text-anchor="middle">可调各轮请求数</text><text x="144.5" y="459" class="node-detail" text-anchor="middle">也可调整门限</text></g>
<text x="38" y="56" class="signal-title" text-anchor="start">写队列门限决定本轮是否从等待队列取出写请求</text>
<text x="38" y="549" class="legend" text-anchor="start">对应从属项 15–18。达到门限后移出的数量并不等于队列容量，也不一定等于当前全部写请求。</text>

<ol aria-label="图中机制"><li><a href="#us11403037b2-fig-5-cmp">写请求队列门限</a><span>决定是否从当前等待队列选取写请求。</span></li><li><a href="#us11403037b2-fig-5-yes">取出由策略选定的一批</a><span>可小于当前待写数量。</span></li><li><a href="#us11403037b2-fig-5-no">本轮搬入零笔写</a><span>不是清除积压，仍可在下一轮重新判断。</span></li><li><a href="#us11403037b2-fig-5-policy">效率用于调整数量或门限</a><span>后续轮次才使用新的配置。</span></li></ol>
