<p>功率仍由一级进入二级。改动发生在反馈起点，二级把按负载线算出的需求上报给一级或输入电源。</p>

<ol aria-label="图中机制"><li><a href="#us12591261b2-fig-4-second">二级稳压器</a> 二级根据所需负载电流与负载线确定所需输入。</li><li><a href="#us12591261b2-fig-4-to-first">所需二级输入</a> 向一级上报时，一级可改变中间轨设定。</li><li><a href="#us12591261b2-fig-4-to-source">可向电源反馈</a> 可向电源上报以改变更上游供电。是否两者都调整由实施方式决定。</li></ol>
