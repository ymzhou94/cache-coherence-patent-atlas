<p>保持访存路径相同。本地比较只在输入都准备好时节省转发时间；分支元数据晚到可抵消收益。</p>

<ol aria-label="图中机制"><li><a href="#us12547401b2-fig-4-data">共同加载路径</a><span>三种比较共用第 5 拍数据就绪，保持缓存和访存服务一致。</span></li><li><a href="#us12547401b2-fig-4-external">未融合</a><span>普通路径需要将 load 值转给分支单元，再对值执行比较，用例中比较结果第 7 拍可用。</span></li><li><a href="#us12547401b2-fig-4-timely">融合，类型已就绪</a><span>融合且分支类型已就绪时，第 5 拍之后立即启动本地比较。结果在第 6 拍可用。</span></li><li><a href="#us12547401b2-fig-4-late">融合，类型晚到</a><span>若分支类型延迟到第 7 拍，数据早到也不能比较；该示例结果在第 8 拍可用。</span></li></ol>
