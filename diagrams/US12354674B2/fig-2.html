<h1>请求有效期间，忙状态怎样阻挡轨的关闭</h1>
<p>用同一个事件轴读复位请求、闪存忙闲和轨供电三个信号。原图 2 的中段显示只有活动结束后才开始复位。</p>

<title id="us12354674b2-fig-2-svg-title">请求有效期间，忙状态怎样阻挡轨的关闭</title>
<desc id="us12354674b2-fig-2-svg-desc">用同一个事件轴读复位请求、闪存忙闲和轨供电三个信号。原图 2 的中段显示只有活动结束后才开始复位。</desc>

</svg></div>

<ol aria-label="图中机制"><li><a href="#us12354674b2-fig-2-request">复位请求有效</a> 请求在闪存仍忙时有效，PMIC 保持供电。</li><li><a href="#us12354674b2-fig-2-ready">活动输出转空闲</a> 活动输出转为空闲，在该等待版本中触发对电源轨的复位。</li><li><a href="#us12354674b2-fig-2-off">供电轨开始复位</a> 由 PMIC 关闭存储电源轨。轨电压的实际过渡由开关与负载决定。</li></ol>
