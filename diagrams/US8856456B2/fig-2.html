<ol aria-label="图中机制"><li><a href="#us8856456b2-fig-2-safe">明确允许跳过</a><span>有效条目且对应组是 no-line-snoop-required。</span></li><li><a href="#us8856456b2-fig-2-query">发起 BTE 请求</a><span>无可用判断，向对端请求。</span></li><li><a href="#us8856456b2-fig-2-expired">到期未收响应</a><span>不再把该块的任何组视作已知可省。</span></li><li><a href="#us8856456b2-fig-2-again">后续访问继续询问</a><span>等待返回后使用一致性协议处理。</span></li></ol>
