<h1>一个 BTE 状态位如何覆盖组内两条缓存行</h1>

<g id="us8856456b2-fig-5-b1"><rect x="723" y="432" width="197" height="82" rx="6" fill="#f5f5f5"/><rect x="723" y="432" width="197" height="82" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="821.5" y="458" class="node-name" text-anchor="middle">组 B 的行 1</text><text x="821.5" y="480" class="node-detail" text-anchor="middle">即便未驻留也须检查</text></g>
<text x="38" y="55" class="signal-title" text-anchor="start">块 tag 命中且有效后，组状态位同时约束它覆盖的两条行</text>
<text x="38" y="565" class="legend" text-anchor="start">原图 6 的两行一组例子。无有效 BTE 时，两组均不能用于跳过 snoop。组 B 行 1 用于说明保守性。</text>
</svg></div>

</figure>
<ol aria-label="图中机制"><li><a href="#us8856456b2-fig-5-tag">块 tag 和有效位</a><span>先从请求物理地址判定是否命中可用 BTE。</span></li><li><a href="#us8856456b2-fig-5-s0">组 A 已知对端不使用</a><span>两条行均可省 snoop，直到其他一致性活动改变状态。</span></li><li><a href="#us8856456b2-fig-5-s1">组 B 至少一行可能使用</a><span>任一成员不确定都会令整个状态组需要 snoop。</span></li><li><a href="#us8856456b2-fig-5-b1">代价落在同组其他行</a><span>未持有的行仍可被保守分类为需要 snoop。</span></li></ol>
