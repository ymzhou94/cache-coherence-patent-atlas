<h1>截断点放在多路偏移求和之后</h1>
<p>说明书允许输入保留比比较器更多的位。加法完成后才把总和量化为比较器位宽，可保留多个小偏移的合计效果。</p>

<text x="53" y="548" class="signal-title" text-anchor="start">位宽和舍入模式由实现选定。表 5 用同一舍入规则隔离运算顺序的影响。</text>

<figcaption>依据 US20260079562A1 原图 3、6A、6B、说明书 0042、0043、0046、0047、0048、0049、0050、0051、权利要求 2、3、12、17</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#fig-3-sum">较宽的加法路径</a><span>基准、裕量偏移与传感器偏差校正量先统一表示。从温度和标定结果得到的偏移可加也可减。</span></li><li><a href="#fig-3-round">输出量化</a><span>舍入、截断或低位进位规则由实现选择。精度只在送入比较器前收窄一次。</span></li><li><a href="#fig-3-comparator">同尺度比较</a><span>把校正阈值编码与电压读数比较，保留了单项量化时可能消失的低位合计。</span></li></ol>
