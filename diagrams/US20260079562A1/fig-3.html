<ol aria-label="图中机制"><li><a href="#fig-3-sum">较宽的加法路径</a> 基准、裕量偏移与传感器偏差校正量先统一表示。从温度和标定结果得到的偏移可加也可减。</li><li><a href="#fig-3-round">输出量化</a> 舍入、截断或低位进位规则由实现选择。精度只在送入比较器前收窄一次。</li><li><a href="#fig-3-comparator">同尺度比较</a> 把校正阈值编码与电压读数比较，保留了单项量化时可能消失的低位合计。</li></ol>
