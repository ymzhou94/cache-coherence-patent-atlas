ol{padding-inline-start:1.45rem}

.component-index dt{font-weight:600}

<ol aria-label="图中机制"><li><a href="#fig-1-junction">测量路径</a> 电压传感器报告供电在该测点的电压。它可能受到 Vdroop，也可能有温度相关的传感误差。</li><li><a href="#fig-1-margin">阈值路径</a> 基准阈值可对应电压下限或上限。功能部件的温度与运行状态影响该部件所需的电压裕量。</li><li><a href="#fig-1-decision">比较结果</a> 本页其余图以低压告警为例。比较结果可触发裕量调整，也可按实施例影响时钟或工作分配。</li></ol>
