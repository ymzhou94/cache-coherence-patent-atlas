<ol aria-label="图中机制"><li><a href="#us12775463b2-fig-5-secondary">次级队列最老 store</a> 次级队首选择最老 store。用 PID 保留它在主队列中的预定位置。</li><li><a href="#us12775463b2-fig-5-judge">迁移位置检查</a> 取两个存储体的队尾状态并查对应位置。PID 对应存储体 A 时，B 的空位不能代替。</li><li><a href="#us12775463b2-fig-5-write">匹配 A，写入该槽</a> 源图例的存储体 A 队尾恰好匹配，写入后已转入队列，不等于该 store 已提交到缓存。</li></ol>
