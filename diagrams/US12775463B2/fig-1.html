<h1>存储队列分层后，哪一层承担写缓存和并行搜索？</h1>
<p>主队列有可用槽时直接接收。主队列满时，次级队列接收溢出，主槽释放后接回最老项。</p>

<ol aria-label="图中机制"><li><a href="#us12775463b2-fig-1-primary">主 store 队列</a><span>主队列的两组存储体可并行访问。其 load 流水能为不同 load 同时寻找对应的较老 store。</span></li><li><a href="#us12775463b2-fig-1-secondary">次级 store 队列</a><span>次级队列只有一组存储体和一条搜索流水的例子。它用较简化的电路承担新增容量。</span></li><li><a href="#us12775463b2-fig-1-move">转入后可提交</a><span>主队列放出空位后，可按次级队首和目标槽位标识决定是否转入。并非只要任意一个位置空了就能转入指定槽。</span></li><li><a href="#us12775463b2-fig-1-cache">缓存数据阵列</a><span>执行向缓存写入的路径出自主队列。两个队列均可以为 load 提供 store 数据。</span></li></ol>
