<h1>从下行 DSB snoop 到目标核的确认</h1>
<p>目标核接收维护通知，并根据访存翻译状态和退休事件决定确认何时可以上送。</p>

<desc id="us12229561b1-fig-1-svg-desc">目标核接收维护通知，并根据访存翻译状态和退休事件决定确认何时可以上送。</desc>

<rect x="240.5" y="86" width="113" height="18" fill="#f5f5f5"/><text x="297" y="100" class="arrow-label" text-anchor="middle">上送 DSB 请求</text>

<rect x="320" y="226" width="118" height="18" fill="#f5f5f5"/><text x="379" y="240" class="arrow-label" text-anchor="middle">上送本地确认</text>

<text x="35" y="444" class="legend" text-anchor="start">已完成地址翻译表示物理地址已知。退休表示指令离开在途状态。</text>
</svg></div>
<figcaption>依据 US12229561B1 原图 4、7、8、15、16、说明书 0044、0047、0048、0049、0050、0051、0052、0053、0061、0062、0063、0064、0065、0066、0067、0079、0081、0086、0087、0089、0097、权利要求 1、2、3、8、9、10、15、16、17</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#us12229561b1-fig-1-llc">CPU cluster 内的 LLC</a><span>同一 CPU cluster 内的 P1/P2 共享 LLC。LLC 向目标核转发来自互连的下行 DSB 通知。</span></li><li><a href="#us12229561b1-fig-1-remember">确定翻译状态边界</a><span>目标核判断有哪些访存指令在 snoop 到达前已经完成地址翻译，且仍在流水线中。</span></li><li><a href="#us12229561b1-fig-1-tracking">访存指令的翻译状态</a><span>主条件是仍在途且已完成翻译。较细的跟踪实施例只等待用到受影响翻译的指令。</span></li><li><a href="#us12229561b1-fig-1-ack">上送本地确认</a><span>相关指令都退休，或者收到通知时相关集合已空，目标核即可回送本地 DSB 确认。</span></li></ol>
