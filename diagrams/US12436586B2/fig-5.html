<h1>逐级退出状态如何被新的电源事件打断</h1>
<p>计数到期可以逐步恢复。新的传感器事件可异步回到之前的限速级，因此恢复不是一段固定的倒计时。</p>

<ol aria-label="图中机制"><li><a href="#us12436586b2-fig-5-normal">默认状态</a><span>默认状态没有施加本次电源事件触发的限速。检测到事件时进入初始级。</span></li><li><a href="#us12436586b2-fig-5-initial">初始限速</a><span>初始级可以是最强限制。可选实施例按位图抑制周期授权。</span></li><li><a href="#us12436586b2-fig-5-step">早期恢复</a><span>计数到期、输入满足时可先进入早期恢复，再依次执行若干级。</span></li><li><a href="#us12436586b2-fig-5-reassert">新控制事件，可返回强限速</a><span>电源管理电路可在恢复过程中异步指示退回。图中展示退回初始级的例子。</span></li></ol>
