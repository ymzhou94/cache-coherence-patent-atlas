<h1>逐级退出状态如何被新的电源事件打断</h1>
<p>计数到期可以逐步恢复。新的传感器事件可异步回到之前的限速级，因此恢复不是一段固定的倒计时。</p>
<figure>

<title id="us12436586b2-fig-5-svg-title">逐级退出状态如何被新的电源事件打断</title>
<desc id="us12436586b2-fig-5-svg-desc">计数到期可以逐步恢复。新的传感器事件可异步回到之前的限速级，因此恢复不是一段固定的倒计时。</desc>

<path id="us12436586b2-fig-5-first" d="M 452 174 L 521 174" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us12436586b2-fig-5-arrow-data)"/>

<text x="37" y="420" class="legend" text-anchor="start">状态步数和每级计数值可配置。虚线表示异步返回的示例。</text>

<ol aria-label="图中机制"><li><a href="#us12436586b2-fig-5-normal">默认状态</a> 默认状态没有施加本次电源事件触发的限速。检测到事件时进入初始级。</li><li><a href="#us12436586b2-fig-5-initial">初始限速</a> 初始级可以是最强限制。可选实施例按位图抑制周期授权。</li><li><a href="#us12436586b2-fig-5-step">早期恢复</a> 计数到期、输入满足时可先进入早期恢复，再依次执行若干级。</li><li><a href="#us12436586b2-fig-5-reassert">新控制事件，可返回强限速</a> 电源管理电路可在恢复过程中异步指示退回。图中展示退回初始级的例子。</li></ol>
