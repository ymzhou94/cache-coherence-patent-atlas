<h1>时钟先恢复，低 QoS 仍处于限速状态</h1>
<p>时钟恢复至原有频率后，低 QoS 的选择性抑制继续到高 QoS 流量满足恢复条件。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="时钟先恢复，低 QoS 仍处于限速状态"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" role="img" aria-labelledby="us12436586b2-fig-4-svg-title us12436586b2-fig-4-svg-desc">
<title id="us12436586b2-fig-4-svg-title">时钟先恢复，低 QoS 仍处于限速状态</title>
<desc id="us12436586b2-fig-4-svg-desc">时钟恢复至原有频率后，低 QoS 的选择性抑制继续到高 QoS 流量满足恢复条件。</desc>
<defs><marker id="us12436586b2-fig-4-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="us12436586b2-fig-4-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="us12436586b2-fig-4-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="us12436586b2-fig-4-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<g id="us12436586b2-fig-4-axis">
<line x1="192" y1="76" x2="192" y2="396" stroke="#4f5d75" opacity=".27"/>
<text x="192" y="64" class="arrow-label" text-anchor="middle">事件</text>
<line x1="321.6" y1="76" x2="321.6" y2="396" stroke="#4f5d75" opacity=".27"/>
<text x="321.6" y="64" class="arrow-label" text-anchor="middle">互连降频</text>
<line x1="451.2" y1="76" x2="451.2" y2="396" stroke="#4f5d75" opacity=".27"/>

<text x="24" y="64" class="arrow-label" text-anchor="start">阶段顺序</text>
</g>

<text x="710.4" y="136" class="arrow-label" text-anchor="middle">回到原有频率</text>
<circle cx="580.8" cy="131" r="5" fill="#4f5d75"/>
<text x="580.8" y="171" class="arrow-label" text-anchor="end">时钟恢复点</text></g>
<g id="us12436586b2-fig-4-low"><text x="24" y="228" class="node-name" text-anchor="start">低 QoS 流量</text>

</svg></div>

<ol aria-label="图中机制"><li><a href="#us12436586b2-fig-4-clock">互连时钟</a><span>按原图 2，事件发生后时钟先降，在恢复阶段重新升回原有频率。说明书给出的时序可部分重叠。</span></li><li><a href="#us12436586b2-fig-4-low">低 QoS 流量</a><span>权利要求 1 的关键约束是时钟恢复以后仍压低一个或多个低 QoS 通道的数据速率。</span></li><li><a href="#us12436586b2-fig-4-high">高 QoS 队列</a><span>高 QoS 的退出判据与原图 2 的判断相对应。满足后的动作是退出或逐步放宽限速。</span></li></ol>

</main></body>
