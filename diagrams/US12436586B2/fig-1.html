<ol aria-label="图中机制"><li><a href="#us12436586b2-fig-1-pm">电源管理电路</a><span>收集传感器测量值并分别输出限速控制和时钟控制。权利要求 1 指向满足电流事件判据的供电事件。</span></li><li><a href="#us12436586b2-fig-1-clk">互连时钟控制</a><span>时钟控制器改变互连输入时钟。初始降频动作没有 QoS 作为输入。</span></li><li><a href="#us12436586b2-fig-1-lim">选择性限速器</a><span>选择性限速器可位于客户端接口或互连内。按通道分队列和仲裁的细节放在图 2。</span></li><li><a href="#us12436586b2-fig-1-fabric">互连交换网络</a><span>原图 1 的虚拟通道 A/B 共享互连硬件。所谓低 QoS 是按各类流量服务要求划分。</span></li></ol>
