<h1>物理行由重命名映射到整行或高低半部</h1>
<p>W3 和 W2 在 ISA 中是不同寄存器，重命名后分别使用 P1 高、低半部。X0 则占 P0 整行。</p>

<ol aria-label="图中机制"><li><a href="#us12498932b1-fig-1-rmt">映射描述宽度及位置</a><span>对 W3 返回的示例物理描述符为 W、P1、Hi。两个窄寄存器返回不同半部。</span></li><li><a href="#us12498932b1-fig-1-wide">X0 → P0 全宽</a><span>宽寄存器连续读取一整行。分配整行需要这行所有半部都可用。</span></li><li><a href="#us12498932b1-fig-1-narrow">P1 高、低半部分别属于 W3、W2</a><span>两个独立的值共享同一个物理行号。读写选择还需要半部位置。</span></li></ol>
