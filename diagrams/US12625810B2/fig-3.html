<ol aria-label="图中机制"><li><a href="#us12625810b2-fig-3-inputs">替换可读取待失效状态</a> 可选策略优先处理已标记的候选。在专用端口实现中，还可并行处理其他逐出。</li><li><a href="#us12625810b2-fig-3-select">覆盖之前发生逐出</a> Need LU 未清，逐出会让近端不再保存旧条目。</li><li><a href="#us12625810b2-fig-3-propagate">向 DL0 传播失效</a> 让关联的下一层条目失效。该过程不同于把新写结果逐出写回。</li></ol>
