<p>两组反馈预算可以并行计算。是否要达到发送阈值，取决于采用的权项或实施例。</p>
<figure>

<ol aria-label="图中机制"><li><a href="#us11513576b2-fig-2-sample">交付滤波功率</a> 测量并滤波是观察端。滤波信号保留各自时间尺度。</li><li><a href="#us11513576b2-fig-2-fast">两环分别计算</a> 快慢环可用相同尖峰误差，但控制器参数和循环周期可不同。</li><li><a href="#us11513576b2-fig-2-map">分配各客户端限制</a> 决策表根据客户端特征把系统级减载目标换成每个客户端的功率上限。</li><li><a href="#us11513576b2-fig-2-send">送出对应时间窗预算</a> 发出的预算与最终减载之间仍有客户端侧执行时间。可选变化阈值作用在发送前。</li></ol>
