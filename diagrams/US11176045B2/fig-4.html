<body><main>
<h1>都预测到需求行时，什么时候回填决定剩余等待</h1>
<p>第 5 拍发生同一需求。预取在第 4 拍回填可立即使用，在第 7 拍回填仍需等 2 拍。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="都预测到需求行时，什么时候回填决定剩余等待"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" role="img" aria-labelledby="us11176045b2-fig-4-svg-title us11176045b2-fig-4-svg-desc">

<desc id="us11176045b2-fig-4-svg-desc">第 5 拍发生同一需求。预取在第 4 拍回填可立即使用，在第 7 拍回填仍需等 2 拍。</desc>

<figcaption>依据 US11176045B2 原图 1、2、8、说明书 0003、0004、0005、0035、0036、0037、0038、0039、0040、0045、0046、0047、0048、0069、0070、0094、0095、权利要求 1、3、9、10、17</figcaption>

<ol aria-label="图中机制"><li><a href="#us11176045b2-fig-4-early">及时预取</a><span>下级读取在 0 拍发出、4 拍回填。假设缓存行保留到第 5 拍，需求依模型在第 5 拍获得数据。</span></li><li><a href="#us11176045b2-fig-4-late">预取仍在途</a><span>下级读取在 3 拍发出、7 拍回填。需求碰到在途预取后可合并等待，需求自身仍等 2 拍。</span></li><li><a href="#us11176045b2-fig-4-none">无预取</a><span>未预取时，第 5 拍需求才发起下级读取，第 9 拍取得数据，等待 4 拍。</span></li></ol>
