<body><main>
<h1>两次预取都先发，为什么后发的一次仍需等待</h1>
<p>同样的下级服务耗时。早发例在正式读前已回填；晚发例虽早于指令交付，正式读时仍未收到数据。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="两次预取都先发，为什么后发的一次仍需等待"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" role="img" aria-labelledby="us12657031b2-fig-4-svg-title us12657031b2-fig-4-svg-desc">
<title id="us12657031b2-fig-4-svg-title">两次预取都先发，为什么后发的一次仍需等待</title>
<desc id="us12657031b2-fig-4-svg-desc">同样的下级服务耗时。早发例在正式读前已回填；晚发例虽早于指令交付，正式读时仍未收到数据。</desc>

<ol aria-label="图中机制"><li><a href="#us12657031b2-fig-4-early">较早发出的预取</a><span>第 3 拍提交，第 15 拍完成下级服务。数据保留到第 16 拍时，读可命中。</span></li><li><a href="#us12657031b2-fig-4-late">较晚发出的预取</a><span>第 8 拍提交，第 20 拍完成服务。需求读时仍在途，模型假定需求合并后等待 4 拍。</span></li><li><a href="#us12657031b2-fig-4-instruction">正式指令</a><span>CPU 第 10 拍交付后，协处理器准备到第 16 拍。这个间隔可以包含译码、依赖等待或排队。</span></li><li><a href="#us12657031b2-fig-4-axis">时间刻度</a><span>第 10 拍是正式交付边界，第 16 拍是实际准备读操作数的边界。主权项前者用于约束，性能度量后者。</span></li></ol>
