<body><main>
<h1>两个控制器同时收到请求时，服务可以重叠</h1>
<p>上面一行显示同一个控制器串行服务，两条中间轨道显示分流后服务重叠，末行检验晚到的代价。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="两个控制器同时收到请求时，服务可以重叠"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" role="img" aria-labelledby="us12737296b2-fig-4-svg-title us12737296b2-fig-4-svg-desc">
<title id="us12737296b2-fig-4-svg-title">两个控制器同时收到请求时，服务可以重叠</title>
<desc id="us12737296b2-fig-4-svg-desc">上面一行显示同一个控制器串行服务，两条中间轨道显示分流后服务重叠，末行检验晚到的代价。</desc>
<defs><marker id="us12737296b2-fig-4-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="us12737296b2-fig-4-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="us12737296b2-fig-4-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="us12737296b2-fig-4-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<g id="us12737296b2-fig-4-axis">
<line x1="192" y1="76" x2="192" y2="488" stroke="#4f5d75" opacity=".27"/>
<text x="192" y="64" class="arrow-label" text-anchor="middle">时隙 0</text>
<line x1="516" y1="76" x2="516" y2="488" stroke="#4f5d75" opacity=".27"/>
<text x="516" y="64" class="arrow-label" text-anchor="middle">时隙 1</text>
<line x1="840" y1="76" x2="840" y2="488" stroke="#4f5d75" opacity=".27"/>
<text x="840" y="64" class="arrow-label" text-anchor="middle">时隙 2</text>
<text x="24" y="64" class="arrow-label" text-anchor="start">时间（服务时隙）</text>
</g>
<g id="us12737296b2-fig-4-single"><text x="24" y="136" class="node-name" text-anchor="start">同归一个控制器</text>
<rect x="192" y="112" width="324" height="38" rx="2" fill="#ececec" stroke="#4f5d75"/>
<text x="354" y="136" class="arrow-label" text-anchor="middle">控制器服务 B0</text>
<rect x="516" y="112" width="324" height="38" rx="2" fill="#ececec" stroke="#4f5d75"/>
<text x="678" y="136" class="arrow-label" text-anchor="middle">控制器服务 B1</text>
<circle cx="840" cy="131" r="5" fill="#4f5d75"/>
<text x="840" y="171" class="arrow-label" text-anchor="end">两笔均结束</text></g>
<g id="us12737296b2-fig-4-parallel0"><text x="24" y="228" class="node-name" text-anchor="start">分流后西侧控制器</text>
<rect x="192" y="204" width="324" height="38" rx="2" fill="#ececec" stroke="#4f5d75"/>
<text x="354" y="228" class="arrow-label" text-anchor="middle">控制器服务 B0</text>
<circle cx="516" cy="223" r="5" fill="#4f5d75"/>
<text x="516" y="263" class="arrow-label" text-anchor="end">B0 完成</text></g>
<g id="us12737296b2-fig-4-parallel1"><text x="24" y="320" class="node-name" text-anchor="start">分流后东侧控制器</text>
<rect x="192" y="296" width="324" height="38" rx="2" fill="#ececec" stroke="#4f5d75"/>
<text x="354" y="320" class="arrow-label" text-anchor="middle">控制器服务 B1</text>
<circle cx="516" cy="315" r="5" fill="#bf4520"/>
<text x="516" y="355" class="arrow-label" text-anchor="end">两笔均结束</text></g>
<g id="us12737296b2-fig-4-staggered"><text x="24" y="412" class="node-name" text-anchor="start">东侧到达晚一时隙</text>
<rect x="516" y="388" width="324" height="38" rx="2" fill="#ececec" stroke="#4f5d75"/>
<text x="678" y="412" class="arrow-label" text-anchor="middle">控制器服务 B1</text>
<circle cx="840" cy="407" r="5" fill="#4f5d75"/>
<text x="840" y="447" class="arrow-label" text-anchor="end">两笔均结束</text></g>
<text x="24" y="512" class="legend" text-anchor="start">每个控制器一次服务一笔，固定 1 时隙。末行的 B1 是唯一晚到的请求。</text>
</svg></div>
<figcaption>依据 US12737296B2 原图 6、10、56、57、58、说明书 0640、0641、0643、0644、0645、0646、权利要求 1、18</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#us12737296b2-fig-4-single">同归一个控制器</a><span>两笔请求同时入队，只允许一次服务一笔。B1 等待 B0 的服务时隙。</span></li><li><a href="#us12737296b2-fig-4-parallel0">分流后的本侧队列</a><span>控制器空闲，B0 一到就能开始服务。</span></li><li><a href="#us12737296b2-fig-4-parallel1">分流后的另一侧队列</a><span>B1 也能立即开始，两笔在同一阶段完成。</span></li><li><a href="#us12737296b2-fig-4-staggered">B1 晚到</a><span>即使控制器空闲，B1 晚一个时隙到达时也不能与 B0 并行。</span></li></ol>
<details class="component-index"><summary>原图标号对照 <span class="component-count">3 项</span></summary><dl><div><dt>内存控制器</dt><dd>A26A–A26D</dd></div><div><dt>西侧互连</dt><dd>F20A</dd></div><div><dt>东侧互连</dt><dd>F20B</dd></div></dl></details>
