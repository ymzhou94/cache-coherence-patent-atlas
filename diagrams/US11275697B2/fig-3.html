<ol aria-label="图中机制"><li><a href="#us11275697b2-fig-3-check">核对清除状态</a><span>未确认清除时保留失效义务。</span></li><li><a href="#us11275697b2-fig-3-compare">比较接收及恢复标记</a><span>请求严格早于恢复点时，才走清除覆盖支路。</span></li><li><a href="#us11275697b2-fig-3-after">边界及新活动期</a><span>等于恢复点的请求继续保留。</span></li><li><a href="#us11275697b2-fig-3-drop">从批次去掉旧请求</a><span>还能继续判断同一批中其他范围的请求。</span></li></ol>
