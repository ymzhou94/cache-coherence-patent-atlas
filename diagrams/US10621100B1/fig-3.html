<style>

<body><main>
<h1>越过长度阈值后，先置待切换再重置位图</h1>
<p>触发条件与执行切换发生在不同的位图读取。清除旧符号后，以新的块单位重新训练。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="越过长度阈值后，先置待切换再重置位图"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 602" role="img" aria-labelledby="us10621100b1-fig-3-svg-title us10621100b1-fig-3-svg-desc">
<title id="us10621100b1-fig-3-svg-title">越过长度阈值后，先置待切换再重置位图</title>
<desc id="us10621100b1-fig-3-svg-desc">触发条件与执行切换发生在不同的位图读取。清除旧符号后，以新的块单位重新训练。</desc>
<defs><marker id="us10621100b1-fig-3-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="us10621100b1-fig-3-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="us10621100b1-fig-3-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="us10621100b1-fig-3-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path id="us10621100b1-fig-3-yes" d="M 635 126 L 722 126" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us10621100b1-fig-3-arrow-main)"/>
<path id="us10621100b1-fig-3-no" d="M 472 182 L 472 238" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us10621100b1-fig-3-arrow-data)"/>
<path id="us10621100b1-fig-3-steady" d="M 635 291 L 722 291" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us10621100b1-fig-3-arrow-data)"/>
<path id="us10621100b1-fig-3-apply" d="M 472 344 L 472 407" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us10621100b1-fig-3-arrow-main)"/>
<path id="us10621100b1-fig-3-covers" d="M 472 476 L 472 507" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us10621100b1-fig-3-arrow-main)"/>
<rect x="664" y="95" width="32" height="18" fill="#f5f5f5"/><text x="680" y="109" class="arrow-label" text-anchor="middle">是</text>
<rect x="485" y="200" width="32" height="18" fill="#f5f5f5"/><text x="501" y="214" class="arrow-label" text-anchor="middle">否</text>
<rect x="664" y="261" width="32" height="18" fill="#f5f5f5"/><text x="680" y="275" class="arrow-label" text-anchor="middle">否</text>
<rect x="485.5" y="362" width="31" height="18" fill="#f5f5f5"/><text x="501" y="376" class="arrow-label" text-anchor="middle">是</text>
<rect x="509" y="481" width="108" height="18" fill="#f5f5f5"/><text x="563" y="495" class="arrow-label" text-anchor="middle">重设覆盖范围</text>
<g id="us10621100b1-fig-3-potential"><polygon points="472.5,70 635,126 472.5,182 310,126" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="472.5" y="123" class="node-name" text-anchor="middle">本次读触发切换条件？</text><text x="472.5" y="144" class="node-detail" text-anchor="middle">长度越阈值且未待切换</text></g>
<g id="us10621100b1-fig-3-pending"><rect x="722" y="91" width="204" height="70" rx="6" fill="#f5f5f5"/><rect x="722" y="91" width="204" height="70" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="824" y="117" class="node-name" text-anchor="middle">只置待切换</text><text x="824" y="139" class="node-detail" text-anchor="middle">保持现有细粒度位图</text></g>
<g id="us10621100b1-fig-3-already"><polygon points="472.5,238 635,291 472.5,344 310,291" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="472.5" y="288" class="node-name" text-anchor="middle">先前已置待切换？</text><text x="472.5" y="309" class="node-detail" text-anchor="middle">读取本表项的状态</text></g>
<g id="us10621100b1-fig-3-nochange"><rect x="722" y="256" width="204" height="70" rx="6" fill="#f5f5f5"/><rect x="722" y="256" width="204" height="70" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="824" y="282" class="node-name" text-anchor="middle">保留现有粒度</text><text x="824" y="304" class="node-detail" text-anchor="middle">本次读取结束</text></g>
<g id="us10621100b1-fig-3-clear"><rect x="344" y="407" width="257" height="69" rx="6" fill="#f5f5f5"/><rect x="344" y="407" width="257" height="69" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><text x="472.5" y="433" class="node-name" text-anchor="middle">清除旧访问符号</text><text x="472.5" y="455" class="node-detail" text-anchor="middle">重用表项，设为粗粒度</text></g>
<g id="us10621100b1-fig-3-invalidate"><rect x="344" y="507" width="257" height="69" rx="6" fill="#f5f5f5"/><rect x="344" y="507" width="257" height="69" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="472.5" y="533" class="node-name" text-anchor="middle">使重叠位图失效</text><text x="472.5" y="555" class="node-detail" text-anchor="middle">适用于覆盖扩大的区域</text></g>
<text x="38" y="552" class="legend" text-anchor="start">说明书实例：64 B → 128 B</text>
<text x="38" y="576" class="legend" text-anchor="start">阈值可配置；单位步长是另加条件。</text>
</svg></div>
<figcaption>依据 US10621100B1 原图 6、9、说明书 0049、0074、0087、0088、0089、0090、权利要求 1、2、3、4、5、6、13、14、15</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#us10621100b1-fig-3-potential">本次读触发切换条件？</a><span>长度超过阈值是独立权项的条件。原图的实施例还可要求单位步长，且原先没有处于待切换状态。</span></li><li><a href="#us10621100b1-fig-3-pending">只置待切换</a><span>只记录待切换状态。当前位图的细粒度符号还没有被清除。</span></li><li><a href="#us10621100b1-fig-3-already">先前已置待切换？</a><span>另一次读取时若不再满足触发分支，但该位图已待切换，则走清除分支。</span></li><li><a href="#us10621100b1-fig-3-invalidate">使重叠位图失效</a><span>指定更粗粒度后，同样多的符号覆盖更大的区域。重叠表项失效，重用原存储位置。</span></li></ol>

</main></body>
