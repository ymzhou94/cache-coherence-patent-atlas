<p>触发条件与执行切换发生在不同的位图读取。清除旧符号后，以新的块单位重新训练。</p>
<figure>

<path id="us10621100b1-fig-3-no" d="M 472 182 L 472 238" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us10621100b1-fig-3-arrow-data)"/>

<rect x="664" y="95" width="32" height="18" fill="#f5f5f5"/><text x="680" y="109" class="arrow-label" text-anchor="middle">是</text>

<g id="us10621100b1-fig-3-potential"><polygon points="472.5,70 635,126 472.5,182 310,126" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="472.5" y="123" class="node-name" text-anchor="middle">本次读触发切换条件？</text><text x="472.5" y="144" class="node-detail" text-anchor="middle">长度越阈值且未待切换</text></g>

<g id="us10621100b1-fig-3-invalidate"><rect x="344" y="507" width="257" height="69" rx="6" fill="#f5f5f5"/><rect x="344" y="507" width="257" height="69" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="472.5" y="533" class="node-name" text-anchor="middle">使重叠位图失效</text><text x="472.5" y="555" class="node-detail" text-anchor="middle">适用于覆盖扩大的区域</text></g>
<text x="38" y="552" class="legend" text-anchor="start">说明书实例：64 B → 128 B</text>

<figcaption>依据 US10621100B1 原图 6、9、说明书 0049、0074、0087、0088、0089、0090、权利要求 1、2、3、4、5、6、13、14、15</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#us10621100b1-fig-3-potential">本次读触发切换条件？</a> 长度超过阈值是独立权项的条件。原图的实施例还可要求单位步长，且原先没有处于待切换状态。</li><li><a href="#us10621100b1-fig-3-pending">只置待切换</a> 只记录待切换状态。当前位图的细粒度符号还没有被清除。</li><li><a href="#us10621100b1-fig-3-already">先前已置待切换？</a> 另一次读取时若不再满足触发分支，但该位图已待切换，则走清除分支。</li><li><a href="#us10621100b1-fig-3-invalidate">使重叠位图失效</a> 指定更粗粒度后，同样多的符号覆盖更大的区域。重叠表项失效，重用原存储位置。</li></ol>

</main></body>
