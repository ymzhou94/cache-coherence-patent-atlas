<ol aria-label="图中机制"><li><a href="#us10621100b1-fig-1-ctl">访问图预取器</a><span>同一访问图的状态服务于两个缓存层。控制器按模式和两个质量因子挑选发哪一路。</span></li><li><a href="#us10621100b1-fig-1-near">近层预取队列</a><span>近层队列会与访问 load、store 等来源共享核内数据缓存的访问多路器。</span></li><li><a href="#us10621100b1-fig-1-far">外部接口预取队列</a><span>外部接口的预取队列能接收 L 候选而无需先查核内数据缓存。</span></li><li><a href="#us10621100b1-fig-1-outer">外层缓存与请求队列</a><span>外层请求队列同样可接收普通缺失等请求。外层缓存是否为 L2 或 L3 由实施例决定。</span></li></ol>
