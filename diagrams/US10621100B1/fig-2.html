<ol aria-label="图中机制"><li><a href="#us10621100b1-fig-2-read">按虚拟区域标签查位图</a><span>表项以虚拟区域标签查找。这里进入图 5 的命中支路，另一支路分配新表项。</span></li><li><a href="#us10621100b1-fig-2-align">按块偏移对齐 AP 后比较</a><span>将当前块的偏移对齐到模式的 AP。模式比较可查 AP 前后。</span></li><li><a href="#us10621100b1-fig-2-symbols">模式：前三个 P，随后两个 L</a><span>原图 3 的混合模式给出三个近层符号与两个外层符号。图示保持原有相对位置。</span></li><li><a href="#us10621100b1-fig-2-enqueue-outer">L：AP +4、+5</a><span>外层的相对位置换算成目标地址后进入外部接口队列。物理地址可迟于虚拟地址到达。</span></li></ol>
