<p>原图 4 的寄存器链把地址依赖传递三次。每次需要新一次供值预测与执行核验。</p>

<ol aria-label="图中机制"><li><a href="#us9710268b2-fig-5-load7">读取到 R7</a><span>原图样例第一个画出的 load 把从 8(R3) 读出的值写至 R7。图从这里开始切出指针链。</span></li><li><a href="#us9710268b2-fig-5-load10">读取到 R10</a><span>年轻 load 的有效地址使用 R7，并加偏移 4。若可用早旁路，R7 不用等常规结果回到寄存器文件。</span></li><li><a href="#us9710268b2-fig-5-load16">读取到 R16</a><span>随后一个 load 用 R10 作基值。这是另一条生产者—消费者关系，必须重新检查。</span></li><li><a href="#us9710268b2-fig-5-load24">读取到 R24</a><span>进一步的 load 用 R16 作基值，每段都可能受真实数据来源或缺失拖长。</span></li></ol>
