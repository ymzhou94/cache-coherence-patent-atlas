<h1>拔线后先更换供电源，再按储能状态降级</h1>
<p>拔线决定由哪台变换器接管。两条高低不同的储能节点电压阈值决定运行模式或关机，不能用负载峰值阈值代替。</p>

<ol aria-label="图中机制"><li><a href="#us12424940b2-fig-4-disconnect">外源断开</a> 端口控制器确认输入断开，停用直供变换器并启用储能变换器的接管。停充电是附加限定。</li><li><a href="#us12424940b2-fig-4-low">低功耗模式</a> V_local 低于第一阈值进入低功耗。在说明书例中，选择可参考追踪到的电量。</li><li><a href="#us12424940b2-fig-4-shutdown">关机</a> 低于更低的第二阈值触发关机。此处是依附于低功耗监视的进一步限定。</li></ol>
