<ol aria-label="图中机制"><li><a href="#us12625723b2-fig-4-bound">已绑定计数器</a> 绑定之后只接受此前已计入事务的完成更新，本槽无法被另一个等待事务重新绑定。</li><li><a href="#us12625723b2-fig-4-zero">依赖已清除</a> 回到初值只清除跨类型依赖，尚需队首等发出条件。</li><li><a href="#us12625723b2-fig-4-new">接替活动计数器</a> 从池中另取空闲槽，承接随后分配的先行型事务。</li><li><a href="#us12625723b2-fig-4-reuse">归还计数器池</a> 旧槽随绑定事务退休而回收。这里把专利中的可选回收实现画成具体路径。</li></ol>
