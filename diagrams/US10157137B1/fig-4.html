<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用命中例展示提前取数隐藏了哪一段延迟</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:clamp(1rem,3vw,2.2rem);background:#f5f8f6;color:#2d3142;font:15.5px/1.65 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
main{max-width:min(1354px,100%);margin:auto;min-width:0;background:#fff;border:1px solid #d4e0da;border-radius:16px;padding:clamp(1.1rem,3vw,2rem);box-shadow:0 2px 10px rgba(16,45,38,.04)}
h1{font-size:clamp(1.35rem,2.6vw,1.85rem);line-height:1.3;margin:0 0 .55rem;letter-spacing:-.015em}
p{margin:.4rem 0 .8rem;color:#3d534b}
figure{margin:1.15rem 0}
.diagram-container{overflow-x:auto;width:100%;max-width:100%;min-width:0;border:1px solid #cddbd4;border-radius:10px;background:#f5f5f5}
svg{display:block;width:100%;min-width:1290px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#2d3142}
.node-name{font-weight:600;font-size:17px}
.node-detail,.arrow-label,.legend{font:14px "Cascadia Mono",Consolas,"PingFang SC","Microsoft YaHei",monospace;fill:#4f5d75}
.signal-title{font-weight:600;font-size:16px}
figcaption{margin-top:.55rem;font-size:.86rem;color:#076047}
ol{padding:0;margin:1rem 0;list-style:none;display:grid;gap:.55rem}
li{display:grid;gap:.18rem;padding:.65rem .85rem;border:1px solid #dce7e1;border-radius:10px;background:#f8fbf9}
li a{color:#076047;font-weight:650;text-underline-offset:.19em;width:fit-content}
li a:hover{color:#054735}
li span{font-size:.93rem;color:#2c4039}
.component-index{margin-top:1rem;border-top:1px solid #dce7e1;padding-top:.8rem}
.component-index summary{cursor:pointer;font-weight:650;color:#076047;font-size:.9rem}
.component-count{font-weight:500;color:#4c625a;font-size:.82rem;margin-left:.25rem}
.component-index dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13.5rem),1fr));gap:.5rem;margin:.7rem 0 0}
.component-index dl>div{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.45rem .65rem;border:1px solid #dce7e1;border-radius:8px;background:#f9fbfa}
.component-index dt{font-weight:600;font-size:.88rem}
.component-index dd{margin:0;font:600 .8rem "Cascadia Mono",Consolas,monospace;color:#076047;background:#e6f4ee;padding:.1rem .4rem;border-radius:5px;white-space:nowrap}
svg :target{scroll-margin:1rem}
svg path:target,svg g:target :is(rect[stroke],path[stroke],line[stroke],polygon[stroke],polyline[stroke],circle[stroke]){stroke:#076047;stroke-width:3.2;filter:drop-shadow(0 0 5px rgba(7,96,71,.45))}
@media print{body{background:#fff;padding:0}main{border:0;box-shadow:none;padding:0}.diagram-container{overflow-x:visible}svg{min-width:0}}
</style>
</head>
<body><main>
<h1>用命中例展示提前取数隐藏了哪一段延迟</h1>
<p>横轴是同一请求的模型周期。两条策略共用数据阵列读两周期、确认在 t3 可用的设定。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="用命中例展示提前取数隐藏了哪一段延迟"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 593" role="img" aria-labelledby="fig-4-svg-title fig-4-svg-desc">
<title id="fig-4-svg-title">用命中例展示提前取数隐藏了哪一段延迟</title>
<desc id="fig-4-svg-desc">横轴是同一请求的模型周期。两条策略共用数据阵列读两周期、确认在 t3 可用的设定。</desc>
<defs><marker id="fig-4-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="fig-4-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-4-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="fig-4-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="24" y="28" class="signal-title" text-anchor="start">教学时序｜同一请求，命中且预测正确</text>
<g id="fig-4-window"><rect x="479" y="166" width="355" height="107" rx="3" fill="rgba(191,69,32,.08)" stroke="transparent"/><text x="658" y="237" class="arrow-label" text-anchor="middle">数据读取与确认判断重叠</text></g>
<line x1="300" x2="300" y1="75" y2="538" stroke="#4f5d75" opacity=".18"/>
<text x="300" y="66" class="arrow-label" text-anchor="middle">t0 请求</text>
<line x1="479" x2="479" y1="75" y2="538" stroke="#4f5d75" opacity=".18"/>
<text x="479" y="66" class="arrow-label" text-anchor="middle">t1 预测</text>
<line x1="657" x2="657" y1="75" y2="538" stroke="#4f5d75" opacity=".18"/>
<text x="657" y="66" class="arrow-label" text-anchor="middle">t2</text>
<line x1="834" x2="834" y1="75" y2="538" stroke="#4f5d75" opacity=".18"/>
<text x="834" y="66" class="arrow-label" text-anchor="middle">t3 确认</text>
<line x1="1012" x2="1012" y1="75" y2="538" stroke="#4f5d75" opacity=".18"/>
<text x="1012" y="66" class="arrow-label" text-anchor="middle">t4</text>
<line x1="1189" x2="1189" y1="75" y2="538" stroke="#4f5d75" opacity=".18"/>
<text x="1189" y="66" class="arrow-label" text-anchor="middle">t5</text>
<g id="fig-4-valid"><text x="24" y="137" class="node-name" text-anchor="start">确认命中位</text>
<polyline points="240,149 834,149 834,110 1218,110" fill="none" stroke="#2e5aa8" stroke-width="2"/></g>
<g id="fig-4-overlap-read"><text x="24" y="234" class="node-name" text-anchor="start">预测后读数据</text>
<polyline points="240,249 479,249 479,205 834,205 834,249 1218,249" fill="none" stroke="#bf4520" stroke-width="2"/></g>
<g id="fig-4-early-return"><text x="24" y="332" class="node-name" text-anchor="start">预测路径的返回</text>
<polyline points="240,352 834,352 834,308 1218,308" fill="none" stroke="#bf4520" stroke-width="2"/></g>
<g id="fig-4-late-read"><text x="24" y="414" class="node-name" text-anchor="start">确认后读数据</text>
<polyline points="240,430 834,430 834,390 1189,390 1189,430 1218,430" fill="none" stroke="#4f5d75" stroke-width="2"/></g>
<g id="fig-4-waiting"><text x="24" y="503" class="node-name" text-anchor="start">等待确认后的返回</text>
<polyline points="240,512 1189,512 1189,475 1218,475" fill="none" stroke="#4f5d75" stroke-width="2"/></g>
<g id="fig-4-read-early"><circle cx="479" cy="205" r="4.5" fill="#bf4520" stroke="#f5f5f5"/><rect x="485" y="176" width="88" height="18" fill="#f5f5f5"/><text x="529" y="190" class="arrow-label" text-anchor="middle">启动读取</text></g>
<g id="fig-4-release"><circle cx="834" cy="308" r="4.5" fill="#bf4520" stroke="#f5f5f5"/><rect x="843" y="275" width="100" height="18" fill="#f5f5f5"/><text x="893" y="289" class="arrow-label" text-anchor="middle">数据可返回</text></g>
<g id="fig-4-baseline"><circle cx="1189" cy="475" r="4.5" fill="#bf4520" stroke="#f5f5f5"/><rect x="1140.5" y="441" width="57" height="18" fill="#f5f5f5"/><text x="1169" y="455" class="arrow-label" text-anchor="middle">返回</text></g>
<text x="24" y="565" class="legend" text-anchor="start">每条路径的延迟从请求 t0 计到数据可向请求方返回。周期和读数组耗时为模型设定。</text>
</svg></div>
<figcaption>依据 US10157137B1 原图 1、4、5、说明书归档段 0020、0027、0041、0042、0043、0045、0046、权利要求 7、8、14</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#fig-4-read-early">t1 预测路出来，启动数据读取</a><span>数据读取与标签确认可以重叠。此时响应门仍未打开。</span></li><li><a href="#fig-4-release">t3 确认路与早读都就绪</a><span>只有确认命中可让早读结果提交。若预测错，即使读完也不允许对请求方可见。</span></li><li><a href="#fig-4-baseline">等待确认才读数组需要再等两周期</a><span>同样的数据路径此时要等 t5。相差两周期来自这组模型时序假设。</span></li></ol>
<details class="component-index"><summary>原图标号对照 <span class="component-count">3 项</span></summary><dl><div><dt>提前选路的预测信号</dt><dd>112</dd></div><div><dt>决定是否能放行的确认信号</dt><dd>122</dd></div><div><dt>数据阵列与返回数据</dt><dd>130、132</dd></div></dl></details>
</main></body>
</html>
