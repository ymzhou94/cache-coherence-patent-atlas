<p>同址条目使新候选丢弃。新候选入队后等队首，冲刷可清除等待条目，下游信用量限制实际交付。</p>

<ol aria-label="图中机制"><li><a href="#us20260203067a1-fig-3-dup">发出队列同址命中？</a> 内容可寻址存储器（CAM）可在候选入队前做同址查重。队列也可在发出后继续保留地址用于抑制重复。</li><li><a href="#us20260203067a1-fig-3-head">已到发出队列队首？</a> 未到首位时观察冲刷事件；继续等待时不重复向后端提交。</li><li><a href="#us20260203067a1-fig-3-flush">清除发出队列</a> 冲刷事件发生后，原图 4 清前端发出队列。这个回路不代表已进入下一缓存层的请求被撤回。</li><li><a href="#us20260203067a1-fig-3-credit">下游可接纳？</a> 原图 5 的容量检查独立于查重，队首有请求并且目标队列允许接纳才交付。</li></ol>
