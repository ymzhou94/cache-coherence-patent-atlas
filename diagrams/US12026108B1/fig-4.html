<h1>升档与降档使用不同的观察长度</h1>
<p>原图 6 为升档和降档配置两个滤波器。示意用一窗升档、三窗降档，短突发结束后仍须积累三窗证据。</p>

<g id="us12026108b1-fig-4-axis">
