<p>在示例中，P 重复出现触发位置告警。之后 Q、R 的首次出现提高占用，软件得到独立信号。</p>

<ol aria-label="图中机制"><li><a href="#us11934265b2-fig-3-count">同位置 P 的多次事件合并到一项</a><span>可纠错次数达到位置阈值时报告地址 P。此时不依赖表被填满。</span></li><li><a href="#us11934265b2-fig-3-capacity">首次在多个位置发现 CE 才会提高占用</a><span>Q、R 各占一个有效条目。这里让其满足单独的占用门槛，只作事件次序例。</span></li><li><a href="#us11934265b2-fig-3-clear">软件读记录后可以释放所选条目</a><span>记录有可见性条件。也可先把快照转存，再使原条目无效；原文不要求释放全部。</span></li></ol>
