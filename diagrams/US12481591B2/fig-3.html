<h1>首次验证成功后，第二次可以略过比较</h1>
<p>两个请求都在访问同一有效缓存行。第二次访问仍查确认位并从数据阵列取数。</p>
<figure>

<title id="us12481591b2-fig-3-svg-title">首次验证成功后，第二次可以略过比较</title>
<desc id="us12481591b2-fig-3-svg-desc">两个请求都在访问同一有效缓存行。第二次访问仍查确认位并从数据阵列取数。</desc>

<line x1="358" y1="80" x2="358" y2="548" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>

<line x1="844" y1="80" x2="844" y2="548" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>

<g id="us12481591b2-fig-3-verify"><path d="M 358 216 L 601 216" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us12481591b2-fig-3-arrow-main)"/><rect x="421" y="192" width="117" height="18" fill="#f5f5f5"/><text x="479.5" y="206" class="arrow-label" text-anchor="middle">读取并比较 tag</text></g>

<g id="us12481591b2-fig-3-set"><path d="M 358 312 L 844 312" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us12481591b2-fig-3-arrow-main)"/><rect x="575" y="288" width="52" height="18" fill="#f5f5f5"/><text x="601" y="302" class="arrow-label" text-anchor="middle">置确认位</text></g>

<rect x="28" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="116" y="63" class="node-name" text-anchor="middle">CPU</text>
<rect x="270" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="358" y="63" class="node-name" text-anchor="middle">缓存控制</text>

<rect x="756" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="844" y="63" class="node-name" text-anchor="middle">确认位存储器</text>
<text x="28" y="580" class="legend" text-anchor="start">只画两次访问的因果顺序。tag 生成与确认位查询可并行，图中未规定各事件耗时。</text>
</svg></div>
<figcaption>依据 US12481591B2 原图 5、6，说明书归档段 0038、0039、0040、0041、0043、0044、0045，权利要求 1、9、10、11、12、17、18、19</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#us12481591b2-fig-3-verify">确认位为 0，先走 tag 比较</a><span>首次读取预测的 way 和请求标签。两值相符后才能给出已验证状态。</span></li><li><a href="#us12481591b2-fig-3-set">核对成功后设置确认位</a><span>该状态供后续请求使用，不提前给当前未经核对的预测放行。</span></li><li><a href="#us12481591b2-fig-3-repeat">第二次查到有效确认则抑制验证电路</a><span>可省略缓存 tag 读取及比较。权项 12、19 还明确省略相应 tag 存储器的读。</span></li></ol>
