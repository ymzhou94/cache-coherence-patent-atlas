<h1>配置内存控制器时可以向多个目标扇出</h1>
<p>广播目标是内存控制器的配置空间。事务管理器收齐各个应答，再给 CPU 一个合并响应。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="配置内存控制器时可以向多个目标扇出"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 458" role="img" aria-labelledby="us12719818b2-fig-4-svg-title us12719818b2-fig-4-svg-desc">
<title id="us12719818b2-fig-4-svg-title">配置内存控制器时可以向多个目标扇出</title>
<desc id="us12719818b2-fig-4-svg-desc">广播目标是内存控制器的配置空间。事务管理器收齐各个应答，再给 CPU 一个合并响应。</desc>
<defs><marker id="us12719818b2-fig-4-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="us12719818b2-fig-4-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="us12719818b2-fig-4-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="us12719818b2-fig-4-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="116" y1="80" x2="116" y2="404" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="358" y1="80" x2="358" y2="404" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="601" y1="80" x2="601" y2="404" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="844" y1="80" x2="844" y2="404" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<g id="us12719818b2-fig-4-ask"><path d="M 116 120 L 358 120" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us12719818b2-fig-4-arrow-data)"/><rect x="185" y="96" width="104" height="18" fill="#f5f5f5"/><text x="237" y="110" class="arrow-label" text-anchor="middle">广播配置空间访问</text></g>
<g id="us12719818b2-fig-4-dup1"><path d="M 358 168 L 601 168" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us12719818b2-fig-4-arrow-main)"/><rect x="440.5" y="144" width="78" height="18" fill="#f5f5f5"/><text x="479.5" y="158" class="arrow-label" text-anchor="middle">配置请求 A</text></g>
<g id="us12719818b2-fig-4-dup2"><path d="M 358 216 L 844 216" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us12719818b2-fig-4-arrow-main)"/><rect x="562" y="192" width="78" height="18" fill="#f5f5f5"/><text x="601" y="206" class="arrow-label" text-anchor="middle">配置请求 B</text></g>

<g id="us12719818b2-fig-4-ack2"><path d="M 844 312 L 358 312" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#us12719818b2-fig-4-arrow-return)"/><rect x="562" y="288" width="78" height="18" fill="#f5f5f5"/><text x="601" y="302" class="arrow-label" text-anchor="middle">配置应答 B</text></g>

<rect x="513" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="601" y="63" class="node-name" text-anchor="middle">内存控制器 A</text>
<rect x="756" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="844" y="63" class="node-name" text-anchor="middle">内存控制器 B</text>
<text x="28" y="436" class="legend" text-anchor="start">原图 6C 的一对多实施例。独权要求集中路由，与此处示例的广播步骤区分。</text>
</svg></div>
<figcaption>依据 US12719818B2 原图 6C、7B，说明书归档段 0098、0099、0100、0101、0102、0103、0130，权利要求 1、11、15</figcaption>

<ol aria-label="图中机制"><li><a href="#us12719818b2-fig-4-dup1">地址落在内存控制器广播空间</a><span>gateway 的事务管理器创建发向两个目标的配置请求。控制器的系统 DRAM 路径继续独立。</span></li><li><a href="#us12719818b2-fig-4-ack2">等待各目标响应</a><span>读广播还可聚合各应答携带的数据。出站遇到反压时，最慢的一支会拉长总时长。</span></li><li><a href="#us12719818b2-fig-4-combine">将合成响应交给源 CPU</a><span>事务管理器在把合成结果交给源侧 NI 后可接着处理下一广播。</span></li></ol>
