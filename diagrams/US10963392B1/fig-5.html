<h1>预取合并和需求命中发生在不同硬件时点</h1>
<p>用两地址区分未发出的预取队列项与已经填入 LLC 的行。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="预取合并和需求命中发生在不同硬件时点"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 458" role="img" aria-labelledby="us10963392b1-fig-5-svg-title us10963392b1-fig-5-svg-desc">
<title id="us10963392b1-fig-5-svg-title">预取合并和需求命中发生在不同硬件时点</title>
<desc id="us10963392b1-fig-5-svg-desc">用两地址区分未发出的预取队列项与已经填入 LLC 的行。</desc>
<defs><marker id="us10963392b1-fig-5-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="us10963392b1-fig-5-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="us10963392b1-fig-5-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="us10963392b1-fig-5-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="116" y1="80" x2="116" y2="404" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="358" y1="80" x2="358" y2="404" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="601" y1="80" x2="601" y2="404" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="844" y1="80" x2="844" y2="404" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<g id="us10963392b1-fig-5-pending"><path d="M 116 120 L 358 120" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us10963392b1-fig-5-arrow-data)"/><rect x="133" y="96" width="208" height="18" fill="#f5f5f5"/><text x="237" y="110" class="arrow-label" text-anchor="middle">预取 X 进入队列，尚未发往内存</text></g>
<g id="us10963392b1-fig-5-merge"><path d="M 116 168 L 358 168" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us10963392b1-fig-5-arrow-main)"/><rect x="100.5" y="144" width="273" height="18" fill="#f5f5f5"/><text x="237" y="158" class="arrow-label" text-anchor="middle">同址需求 X 到来，标志改为 demand</text></g>
<g id="us10963392b1-fig-5-countMerge"><path d="M 358 216 L 844 216" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#us10963392b1-fig-5-arrow-return)"/><rect x="458" y="192" width="286" height="18" fill="#f5f5f5"/><text x="601" y="206" class="arrow-label" text-anchor="middle">统计未完成的 merged prefetch</text></g>
<g id="us10963392b1-fig-5-other"><path d="M 116 264 L 601 264" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us10963392b1-fig-5-arrow-data)"/><rect x="241.5" y="240" width="234" height="18" fill="#f5f5f5"/><text x="358.5" y="254" class="arrow-label" text-anchor="middle">另一个预取 Y 已返回并填入 LLC</text></g>
<g id="us10963392b1-fig-5-read"><path d="M 116 312 L 601 312" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us10963392b1-fig-5-arrow-data)"/><rect x="280.5" y="288" width="156" height="18" fill="#f5f5f5"/><text x="358.5" y="302" class="arrow-label" text-anchor="middle">需求命中已驻留的预取 Y</text></g>

<rect x="270" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="358" y="63" class="node-name" text-anchor="middle">LLC 的 miss 队列</text>
<rect x="513" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="601" y="63" class="node-name" text-anchor="middle">LLC 缓存阵列</text>
<rect x="756" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="844" y="63" class="node-name" text-anchor="middle">分配器计数器</text>
<text x="28" y="436" class="legend" text-anchor="start">上下是两条不同地址的路径。原图 5、6 区分回填前合并与回填后命中，二者观测时点不同。</text>
</svg></div>
<figcaption>依据 US10963392B1 原图 2、5、6、说明书 0037、0038、0043、0058、0060、0062、权利要求 3、5、11、13</figcaption>

<ol aria-label="图中机制"><li><a href="#us10963392b1-fig-5-merge">未发出的预取可转为 demand</a><span>同址需求命中时改队列的请求类型。</span></li><li><a href="#us10963392b1-fig-5-countMerge">统计合并预取</a><span>在 miss 队列中可记录。</span></li><li><a href="#us10963392b1-fig-5-other">预取已被填入 LLC</a><span>对应不同的已驻留行。</span></li><li><a href="#us10963392b1-fig-5-countUsed">需求命中后增加已使用预取数</a><span>可用于预取准确度的分子。</span></li></ol>
