<h1>预取合并和需求命中发生在不同硬件时点</h1>
<p>用两地址区分未发出的预取队列项与已经填入 LLC 的行。</p>

<title id="us10963392b1-fig-5-svg-title">预取合并和需求命中发生在不同硬件时点</title>

<rect x="756" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="844" y="63" class="node-name" text-anchor="middle">分配器计数器</text>
