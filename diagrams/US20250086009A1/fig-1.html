<ol aria-label="图中机制"><li><a href="#us20250086009a1-fig-1-swap">交换通知</a><span>GPU 完成工作帧后交换缓冲角色，可以向 CPU 性能控制器通知交换事件。</span></li><li><a href="#us20250086009a1-fig-1-window">完成窗口估计</a><span>两次交换时刻可界定一个完成窗口。实施例还能利用目标帧率或其他性能要求估计边界。</span></li><li><a href="#us20250086009a1-fig-1-work">CPU 进程观测</a><span>CPU 进程活动在这些窗口内分别统计。已提供给 GPU 的绘制工作和用于进程归因的 CPU 完成量处在不同路径。</span></li><li><a href="#us20250086009a1-fig-1-state">CPU 性能状态</a><span>候选 CPU 性能状态用于执行已识别负载；控制器还需判断它是否受截止时间约束。</span></li></ol>
