<ol aria-label="图中机制"><li><a href="#us20240202146a1-fig-4-state">读取有效延迟指示</a> 一条配置信息启用模式，或本次 SYNC 操作数给出等待。</li><li><a href="#us20240202146a1-fig-4-dhold">等待放在译码级</a> 等待结束后才将已译码的 SYNC 送往执行级。</li><li><a href="#us20240202146a1-fig-4-execsend">等待放在执行级</a> 执行级收到 SYNC 和延迟值后，可装载多位计数器。</li><li><a href="#us20240202146a1-fig-4-normal">普通路径</a> 没有有效延迟指示时，沿用基础启动时序。</li></ol>
