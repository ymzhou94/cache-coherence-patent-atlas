<ol aria-label="图中机制"><li><a href="#us12332723b2-fig-1-req">事件要求时长</a> 事件要求时长由主端按暂停需要计算，作为每个相关代理要达到的门槛。</li><li><a href="#us12332723b2-fig-1-summary">裸片级容忍时长</a> 裸片级容忍时长先在各裸片按读、写分别求最小值，再由从电源管理器送主电源管理器。</li><li><a href="#us12332723b2-fig-1-report">代理容忍时长</a> 代理分别上报当前估计的读、写容忍时长。读侧由已有数据估算，写侧由可用空位估算。</li><li><a href="#us12332723b2-fig-1-ack">从端就绪确认</a> 独权要求主端收到至少必要的远端确认后才能解除阻塞，段 0039 将确认和周期性容忍值上报区别开来。</li></ol>
