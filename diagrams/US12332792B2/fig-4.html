<h1>独立 snoop 缓冲用满时，等待怎样绕回原请求</h1>
<p>当其它完成应答仍依赖 snoop VC，独立挂起项用满可把等待变为循环。把同址 snoop 放入既有项可减少这类 backpressure。</p>

<g id="us12332792b2-fig-4-r0"><rect x="55" y="376" width="240" height="89" rx="6" fill="#f5f5f5"/><rect x="55" y="376" width="240" height="89" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><text x="175" y="402" class="node-name" text-anchor="middle">在途请求缓冲项</text><text x="175" y="424" class="node-detail" text-anchor="middle">原请求等待相关完成确认</text></g>

<text x="55" y="502" class="legend" text-anchor="start">内侧实线表示同址吸收路径。外环表示缓冲占用或消息进展的等待依赖。</text>

<ol aria-label="图中机制"><li><a href="#us12332792b2-fig-4-pressure">backpressure传回 snoop VC</a><span>只在独立位置耗尽、停止接纳 snoop 且应答仍依赖进展时，才出现这里示出的循环。</span></li><li><a href="#us12332792b2-fig-4-absorb">向已有项吸收</a><span>同址 snoop 沿此选择进入原请求条目，避免再占一项独立 snoop 缓冲。</span></li></ol>
