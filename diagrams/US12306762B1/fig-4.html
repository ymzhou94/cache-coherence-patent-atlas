<h1>在入队前拦截或在队列中撤销</h1>
<p>前一种路径可在生成前拒绝。后一种允许先入队再撤销，且可单独回报预取器以释放该请求的跟踪记录。</p>

<title id="us12306762b1-fig-4-svg-title">在入队前拦截或在队列中撤销</title>

<ol aria-label="图中机制"><li><a href="#us12306762b1-fig-4-early-query">路径 A：生成前查地址 A</a> 权利要求 13 把发送候选地址放在请求生成前。查询命中活动表项即可使该候选不曾入队。</li><li><a href="#us12306762b1-fig-4-enq">路径 B：预取 B 已入队</a> 原图 5 允许先生成并入队，同时或稍后才查询候选地址。</li><li><a href="#us12306762b1-fig-4-remove">活动项命中，撤销 B</a> 命中活动项时移除仍在队列中的对应请求。已被放行的其他请求继续送下层。</li><li><a href="#us12306762b1-fig-4-credit">可选：通知已处理以更新额度</a> 原图 4 的可选额度规则对拒绝计次。通知只改变预取器记录，没有触发下层请求。</li></ol>
