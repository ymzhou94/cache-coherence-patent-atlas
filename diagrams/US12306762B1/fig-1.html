<ol aria-label="图中机制"><li><a href="#us12306762b1-fig-1-cache">缓存与标签</a> 预取回填置 PF；驻留期间读命中清 PF。逐出时表项训练读取这段驻留期的状态。</li><li><a href="#us12306762b1-fig-1-evict">逐出报告</a> 逐出报告可包含地址的全部或部分、缓存标签和用过与否。标签无法读取时，有实施例跳过训练。</li><li><a href="#us12306762b1-fig-1-pdl">预取限制表（PDL）</a> 地址索引找到候选位置，标签确认所查的是同一个地址。活动状态可由未用计数是否达到阈值决定。</li><li><a href="#us12306762b1-fig-1-gate">预取发出控制</a> 活动项命中只作用于相应预取候选。需求访问仍由缓存和内存系统按原流程处理。</li></ol>
