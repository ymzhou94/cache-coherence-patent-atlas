<p>先回填并记录使用，再用逐出报告训练历史。后来再次预测同一地址时才判断是否拒绝。</p>

<ol aria-label="图中机制"><li><a href="#us12306762b1-fig-2-fill">回填 A，置 PF</a> 示例从通过检查的预取开始，下层先返回数据，缓存回填并置 PF。</li><li><a href="#us12306762b1-fig-2-unused">逐出 A，PF 仍置位：未用</a> 若直到逐出都没有命中，这段缓存驻留被记为未用。已有项可增加计数，首次分配项的初值随实施例而定。</li><li><a href="#us12306762b1-fig-2-trained">未用更新计数，用过复位</a> 两支反馈互斥。原图 7 复位已有计数，无论旧计数当时是否达到阈值。</li><li><a href="#us12306762b1-fig-2-query">后来再次预测地址 A，查询活动项</a> 时间来到另一次同地址的预测。只有所查表项的计数达到阈值或满足活动条件，候选才被拒。</li></ol>
