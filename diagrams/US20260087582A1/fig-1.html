<h1>工作从主队列到分布式槽位，状态如何回到电源控制</h1>
<p>KSM 一面给 mGPU 派工，一面跟踪已派工作的状态。电源管理能同时考虑前端队列和已执行或运行中的槽位。</p>

<ol aria-label="图中机制"><li><a href="#us20260087582a1-fig-1-queues">共享内存中的主队列</a><span>共享内存主队列给出已排队 kick。关联配置数据可以经寄存器复制引擎预取，不必等到执行阶段再读。</span></li><li><a href="#us20260087582a1-fig-1-ksm">硬件派工控制器 KSM</a><span>KSM 读队首、处理依赖，再将可运行任务映射到逻辑槽位。数据管理器选择分布式槽位。</span></li><li><a href="#us20260087582a1-fig-1-score">工作跟踪表</a><span>工作跟踪表记录逻辑及分布式槽位状态。工作类型和当前活动状态可以输入供电决策。</span></li><li><a href="#us20260087582a1-fig-1-pwr">电源处理器与门控</a><span>电源处理器接收供电控制请求。说明书也允许 KSM 直接控制门控硬件。</span></li></ol>
