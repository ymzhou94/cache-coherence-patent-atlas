<ol aria-label="图中机制"><li><a href="#us20260087582a1-fig-2-pio">PIO 写，唤醒 GPU 前端</a> 原图 3 的 PIO 写使可单独供电的前端就绪。CPU 驱动还可更新内存里主队列。</li><li><a href="#us20260087582a1-fig-2-ready">检查队首 kick 是否可运行</a> 只有有效队列里队首 kick 被解除阻塞才进入图示的唤醒支路。尾部追加本身不保证着色器醒来。</li><li><a href="#us20260087582a1-fig-2-wake">接通所需子单元的电源</a> 电源处理器接通需要的 mGPU 或专用单元。</li><li><a href="#us20260087582a1-fig-2-unpause">解除派工暂停</a> 所需资源唤醒后，电源处理器撤销 scheduling pause，KSM 恢复派工。</li></ol>
