<p>计时结束先查一次，暂停派工以后再查。满足条件才写关断寄存器，收到响应后恢复派工。</p>

<ol aria-label="图中机制"><li><a href="#us20260087582a1-fig-5-timer">启动延迟关断计时，再核对空闲</a> KSM 观察空闲后启动延迟关断计时。计时期间重新观察活跃状态。</li><li><a href="#us20260087582a1-fig-5-pause">仍空闲，暂停派工</a> 确认仍空闲后暂停派工，避免新工作在发起关断时进入目标。</li><li><a href="#us20260087582a1-fig-5-recheck">仍为空闲，可继续</a> 若目标仍空闲，才发送关断写。若状态已变化，当前路径不能沿图继续关断。</li><li><a href="#us20260087582a1-fig-5-resume">恢复派工</a> 原文允许执行关断寄存器的屏障读取。收到确认响应以后，派工才恢复。</li></ol>
