<h1>物理可分配和历史可查是不同寿命</h1>
<p>P20 回到空闲表时，历史文件中的映射名可暂时仍然存在。基线则继续占用物理条目，直到对应覆盖指令退休。</p>

<ol aria-label="图中机制"><li><a href="#us12554505b1-fig-3-prior">基线以覆盖者退休作为回收点</a><span>在此之前未来指令无法从同一空闲表拿到 P20。</span></li><li><a href="#us12554505b1-fig-3-early">提前释放以消费者执行为触发</a><span>早释放改善物理寄存器压力，需要提前释放形成的窗口被后续申请使用。</span></li><li><a href="#us12554505b1-fig-3-hist">历史文件仍保留旧映射的名字</a><span>映射记录并不等同于把 P20 值复制到另一存储。不能用记录名这一动作推断任意回滚都能取回旧值。</span></li></ol>
