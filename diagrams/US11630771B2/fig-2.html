<body><main>
<h1>两条匹配命令共享一个实际失效边界</h1>
<p>对同一条目重复标记可以合并。关联同步到达后，条目才从仍可命中转为无效。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="两条匹配命令共享一个实际失效边界"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" role="img" aria-labelledby="us11630771b2-fig-2-svg-title us11630771b2-fig-2-svg-desc">
<title id="us11630771b2-fig-2-svg-title">两条匹配命令共享一个实际失效边界</title>
<desc id="us11630771b2-fig-2-svg-desc">对同一条目重复标记可以合并。关联同步到达后，条目才从仍可命中转为无效。</desc>
<defs><marker id="us11630771b2-fig-2-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="us11630771b2-fig-2-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="us11630771b2-fig-2-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="us11630771b2-fig-2-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<g id="us11630771b2-fig-2-axis">
<line x1="192" y1="76" x2="192" y2="304" stroke="#4f5d75" opacity=".27"/>
<text x="192" y="64" class="arrow-label" text-anchor="middle">初始</text>
<line x1="354" y1="76" x2="354" y2="304" stroke="#4f5d75" opacity=".27"/>
<text x="354" y="64" class="arrow-label" text-anchor="middle">第一条命令</text>
<line x1="516" y1="76" x2="516" y2="304" stroke="#4f5d75" opacity=".27"/>
<text x="516" y="64" class="arrow-label" text-anchor="middle">第二条命令</text>
<line x1="678" y1="76" x2="678" y2="304" stroke="#4f5d75" opacity=".27"/>
<text x="678" y="64" class="arrow-label" text-anchor="middle">关联同步</text>
<line x1="840" y1="76" x2="840" y2="304" stroke="#4f5d75" opacity=".27"/>
<text x="840" y="64" class="arrow-label" text-anchor="middle">结束</text>
<text x="24" y="64" class="arrow-label" text-anchor="start">阶段顺序</text>
</g>
<g id="us11630771b2-fig-2-pending"><text x="24" y="136" class="node-name" text-anchor="start">待失效标记</text>
<rect x="192" y="112" width="162" height="38" rx="2" fill="#ececec" stroke="#4f5d75"/>
<text x="273" y="136" class="arrow-label" text-anchor="middle">未标记</text>
<rect x="354" y="112" width="324" height="38" rx="2" fill="#ececec" stroke="#4f5d75"/>
<text x="516" y="136" class="arrow-label" text-anchor="middle">已标记，等待同步</text>
<rect x="678" y="112" width="162" height="38" rx="2" fill="#ececec" stroke="#4f5d75"/>
<text x="759" y="136" class="arrow-label" text-anchor="middle">清除标记</text>
<circle cx="354" cy="131" r="5" fill="#4f5d75"/>
<text x="354" y="171" class="arrow-label" text-anchor="end">首次标记</text></g>
<g id="us11630771b2-fig-2-valid"><text x="24" y="228" class="node-name" text-anchor="start">条目 X 的状态</text>
<rect x="192" y="204" width="486" height="38" rx="2" fill="#ececec" stroke="#4f5d75"/>
<text x="435" y="228" class="arrow-label" text-anchor="middle">仍可命中</text>
<rect x="678" y="204" width="162" height="38" rx="2" fill="#ececec" stroke="#4f5d75"/>
<text x="759" y="228" class="arrow-label" text-anchor="middle">无效</text>
<circle cx="678" cy="223" r="5" fill="#bf4520"/>
<text x="678" y="263" class="arrow-label" text-anchor="end">实际失效</text></g>
<text x="24" y="328" class="legend" text-anchor="start">两条命令定位同一条目，且各自满足延期条件。本图只表示先后，无周期参数。</text>
</svg></div>
<figcaption>依据 US11630771B2 原图 5、说明书 0007、0008、0070、0071、0074、0077、0078、0079、权利要求 1、7、8、9、10、14、17、18</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#us11630771b2-fig-2-pending">待失效标记</a> 第一次命令置标记，第二次仍指同一条目。实际失效后标记被清除。</li><li><a href="#us11630771b2-fig-2-valid">实际有效状态</a> 同步之前条目仍有效，图 4 用权利要求 7 演示命中。</li></ol>
