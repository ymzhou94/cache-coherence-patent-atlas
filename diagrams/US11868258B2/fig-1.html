<ol aria-label="图中机制"><li><a href="#us11868258b2-fig-1-msg">控制器消息头</a> 消息携带目录的预期当前状态，也表达请求执行的状态变化。</li><li><a href="#us11868258b2-fig-1-state">本地状态</a> 接收方读取实际缓存行标签，形成与消息头独立的比较输入。</li><li><a href="#us11868258b2-fig-1-allow">执行门槛</a> 不一致时推迟。此前序消息使状态推进后重新判断。</li></ol>
