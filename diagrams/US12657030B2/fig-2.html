<h1>从首次执行训练到下一次回填写入偏向信息</h1>
<p>图中间隔一次缓存行重填。偏向表先得到实际结果，缓存表示在回填时读取已有偏向并写入。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="从首次执行训练到下一次回填写入偏向信息"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="us12657030b2-fig-2-svg-title us12657030b2-fig-2-svg-desc">

<desc id="us12657030b2-fig-2-svg-desc">图中间隔一次缓存行重填。偏向表先得到实际结果，缓存表示在回填时读取已有偏向并写入。</desc>
<defs><marker id="us12657030b2-fig-2-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="us12657030b2-fig-2-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="us12657030b2-fig-2-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="us12657030b2-fig-2-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>

<g id="us12657030b2-fig-2-learn"><path d="M 844 216 L 358 216" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us12657030b2-fig-2-arrow-main)"/><rect x="529.5" y="192" width="143" height="18" fill="#f5f5f5"/><text x="601" y="206" class="arrow-label" text-anchor="middle">首次结果为真，写 10</text></g>

<text x="28" y="532" class="legend" text-anchor="start">时间向下。两次回填之间的间隔由缓存命中和替换决定。</text>
</svg></div>
<figcaption>依据 US12657030B2 原图 1、2A、3A、4、说明书 0021、0024、0025、0027、0028、0031、0036、0037、0039、0041、0042、0045、0047、0049、0050、权利要求 1、4、5、6、7、14</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#us12657030b2-fig-2-first">首次填入，尚无偏向</a><span>第一次回填只有原始条件指令，偏向表条目是初始 00。</span></li><li><a href="#us12657030b2-fig-2-learn">首次结果为真，写 10</a><span>执行结果为真可以把该条目的偏向状态从 00 改成 10。</span></li><li><a href="#us12657030b2-fig-2-reload">后来重填，按 PC 查偏向</a><span>模型选择指令后来再次回填的情形，若中途没有重新编码或回填，旧缓存副本可能未见新预测。</span></li><li><a href="#us12657030b2-fig-2-put">写入指令及偏向信息</a><span>回填写编码时才产生带偏向信息的新缓存副本。</span></li><li><a href="#us12657030b2-fig-2-opposite">实际改为假，写 11</a><span>真实结果改为假后，执行侧可先更新偏向表为 11，错误目标取指需重定向。</span></li></ol>
