<h1>两位偏向表项只有四种状态，11 等待重置</h1>
<p>首次观测写入真或假。与已学偏向相反时变成不偏向，后续执行不会直接在 01 与 10 之间切换。</p>
<figure>

<ol aria-label="图中机制"><li><a href="#us12657030b2-fig-4-cold">00｜初始</a><span>00 表示索引条目无观测。初始状态并不预测假。</span></li><li><a href="#us12657030b2-fig-4-f">01｜偏向为假</a><span>01 对应偏向为假。实际仍假可保持，第一次实际为真则退出偏向。</span></li><li><a href="#us12657030b2-fig-4-t">10｜偏向为真</a><span>10 对应偏向为真。实际仍真可保持，第一次实际为假则退出偏向。</span></li><li><a href="#us12657030b2-fig-4-unbiased">11｜未认定偏向</a><span>11 表示已观测但未认定偏向。常规预测器可以对该动态指令继续预测。</span></li><li><a href="#us12657030b2-fig-4-reset">重置为初始</a><span>说明书允许未偏向表项比例达到阈值时重置。复位后这些条目可以重新学习。</span></li></ol>
