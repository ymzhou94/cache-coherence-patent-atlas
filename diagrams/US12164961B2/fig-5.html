<p>电池测量给出同一窗口的总量参照。组件活动遥测和后台活动时间段用于分解估计，得到慢累计能耗。</p>

<ol aria-label="图中机制"><li><a href="#us12164961b2-fig-5-battery">电池电量检测</a> 电池电量检测器能记录所用窗口的总耗能。其观测范围覆盖设备，并不提供独立进程的实际能耗读数。</li><li><a href="#us12164961b2-fig-5-calibrate">慢引擎中的模型校准</a> 将组件模型的估计与电池总耗能对照。说明书允许用差异调整模型，没有给固定比例算法。</li><li><a href="#us12164961b2-fig-5-activity">设备遥测及活动区间</a> 设备遥测和客户端活动起止为归因提供活动窗口，组件能耗由模型估计。</li><li><a href="#us12164961b2-fig-5-slow">慢累计估计与时间戳</a> 输出是后台活动慢累计估计与覆盖时刻。图 2、图 4 使用这个时刻区分快值与慢值。</li></ol>
