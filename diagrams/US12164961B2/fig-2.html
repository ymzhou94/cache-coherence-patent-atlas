<ol aria-label="图中机制"><li><a href="#us12164961b2-fig-2-slow">慢累计值与覆盖时刻</a> 接收最新可用的慢速累计值及其覆盖终点 tS。终点用同一时间坐标表示。</li><li><a href="#us12164961b2-fig-2-range">查 tS 与 tC 累计值</a> 快速引擎准备 tS、tC 两个端点的累计能耗。两者相减得到 tS 至 tC 的区间能耗。</li><li><a href="#us12164961b2-fig-2-combine">将快增量拼接到慢估计</a> 拼接规则为慢速累计值加上两个快速累计值之差。</li><li><a href="#us12164961b2-fig-2-report">发送合成累计能耗</a> 合成量发给后台活动准入控制器。它可据新的累计量改变下一次决定。</li></ol>
