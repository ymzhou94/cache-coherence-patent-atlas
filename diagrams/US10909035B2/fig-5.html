<style>
*{box-sizing:border-box}
body{margin:0;padding:clamp(1rem,3vw,2.2rem);background:#f5f8f6;color:#2d3142;font:15.5px/1.65 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}

<body><main>
<h1>外部 snoop 穿过保留的 L2 控制层</h1>
<p>原图 8 追踪另一处理器发来的 snoop。零容量层不查标签，也不能用同层是否命中过滤 L1D。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="外部 snoop 穿过保留的 L2 控制层"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" aria-labelledby="fig-5-svg-title fig-5-svg-desc">
<title id="fig-5-svg-title">外部 snoop 穿过保留的 L2 控制层</title>
<desc id="fig-5-svg-desc">原图 8 追踪另一处理器发来的 snoop。零容量层不查标签，也不能用同层是否命中过滤 L1D。</desc>
<defs><marker id="fig-5-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="fig-5-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-5-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="fig-5-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>

<line x1="116" y1="80" x2="116" y2="356" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="480" y1="80" x2="480" y2="356" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="844" y1="80" x2="844" y2="356" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<g id="fig-5-extreq"><path d="M 116 120 L 480 120" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#fig-5-arrow-data)"/><rect x="200.5" y="96" width="195" height="18" fill="#f5f5f5"/><text x="298" y="110" class="arrow-label" text-anchor="middle">外部 snoop：完整地址 P</text></g>
<g id="fig-5-skip"><path d="M 480 162 L 504 162 Q 512 162 512 170 L 512 172 Q 512 180 504 180 L 480 180" fill="none" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#fig-5-arrow-control)"/><rect x="542" y="138" width="104" height="18" fill="#f5f5f5"/><text x="594" y="152" class="arrow-label" text-anchor="middle">跳过本层缓存查找</text></g>

<rect x="28" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="116" y="63" class="node-name" text-anchor="middle">外部 snoop 发起方</text>
<rect x="392" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="480" y="63" class="node-name" text-anchor="middle">L2 控制器</text>
<rect x="756" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="844" y="63" class="node-name" text-anchor="middle">本地 L1D 控制器</text>
<text x="28" y="388" class="legend" text-anchor="start">图中重点是 snoop 的转发与响应。数据缓存容量为零仍须处理进入这一层的远端请求。</text>
</svg></div>
<figcaption>依据 US10909035B2 原图 1、2、8、说明书归档段 0036、0038、0040、0041、0059</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#fig-5-forward">完整地址继续传给 L1D</a><span>到达 L2 的远端查询既没有本地标签可以判断，也不应截断上行探查。</span></li><li><a href="#fig-5-reply">最终结果来自 L1D</a><span>L2 控制器回送由 L1D 得出的 hit／miss。图中省略未在原图 8 定义的协议数据动作。</span></li></ol>
<details class="component-index"><summary>原图标号对照 <span class="component-count">4 项</span></summary><dl><div><dt>L2 接收远端 snoop</dt><dd>802</dd></div><div><dt>跳过零容量层的查找</dt><dd>804</dd></div><div><dt>通过完整地址向 L1D 转发</dt><dd>806</dd></div><div><dt>依据 L1D 响应服务发起方</dt><dd>808</dd></div></dl></details>
