<h1>复用与另发请求时，CPU 分别等待多久</h1>
<p>同一服务时间下，合并保留预取的时间领先。需求仍要从第 3 拍等到第 9 拍。</p>

<desc id="us9454486b2-fig-4-svg-desc">同一服务时间下，合并保留预取的时间领先。需求仍要从第 3 拍等到第 9 拍。</desc>
<defs><marker id="us9454486b2-fig-4-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="us9454486b2-fig-4-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="us9454486b2-fig-4-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="us9454486b2-fig-4-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>

<figcaption>依据 US9454486B2 原图 5、6、7、说明书 0022、0053、0058、0060、0061、0065、0066、0067、0069、0070、0071、0072、0073、权利要求 1、7、12、13、15</figcaption>

<ol aria-label="图中机制"><li><a href="#us9454486b2-fig-4-pf">在途预取 X</a><span>预取第 0 拍发出、第 8 拍返回。若需求到时已经填完且驻留，应按缓存命中路径测量。</span></li><li><a href="#us9454486b2-fig-4-reuse">需求读 · 合并</a><span>需求第 3 拍改写条目，内存等到第 8 拍，模型另计 1 拍数据交接。观察窗口是 3 到 9。</span></li><li><a href="#us9454486b2-fig-4-separate">需求读 · 另发</a><span>对照中没有本层或下层合并，需求第 3 拍发出自己的请求，第 11 拍数据返回，第 12 拍 CPU 得数。</span></li></ol>
