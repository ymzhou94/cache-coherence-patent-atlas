<p>缓存行地址相同才复用预取条目。行内偏移用于选字节，不能单独决定是否分配新项。</p>

<ol aria-label="图中机制"><li><a href="#us9454486b2-fig-3-offset">需求字节地址</a> 示例设 64 B 行，需求地址 0x1038 的行地址仍是 0x1000。0x1040 是下一行。</li><li><a href="#us9454486b2-fig-3-row">在途预取条目</a> 查找地址 PRB 的在途预取行地址，CAM 为可选实现。</li><li><a href="#us9454486b2-fig-3-select">地址 PRB 匹配</a> 既要匹配行地址，也要看到有效的预取状态。</li><li><a href="#us9454486b2-fig-3-merge">改写相同条目</a> 符合条件时沿用原 PRB 槽，改写来源与状态并等原事务。</li><li><a href="#us9454486b2-fig-3-new">保存新需求请求</a> 没有符合条件的预取项时，将需求读登记为自己的请求。</li></ol>
