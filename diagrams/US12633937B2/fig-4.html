<ol aria-label="图中机制"><li><a href="#us12633937b2-fig-4-up">误差向上趋势</a> 历史误差码接近窗口上边界，触发向上跟踪。实际变化速率由实现决定。</li><li><a href="#us12633937b2-fig-4-move-up">抬高窗口</a> 同样的比特数覆盖更集中范围。图示改变窗位置，不宣称精确增益。</li><li><a href="#us12633937b2-fig-4-move-down">下移窗口</a> 误差持续下行时，下一窗口可以下移，防止低端码值饱和。</li></ol>
