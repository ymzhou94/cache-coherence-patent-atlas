<h1>从热状态更新到任务取得处理器服务</h1>
<p>预算按层发送。资源分配端执行任务获得 CPU 执行机会的频度约束，QoS 层的实际功耗再进入闭环。</p>

<ol aria-label="图中机制"><li><a href="#us11809256b2-fig-2-observe">更新温度或转速</a> 热状态观测可来自外壳温度估计或风扇转速。多个 QoS 层可使用同一观测。</li><li><a href="#us11809256b2-fig-2-per_tier">更新该层预算</a> 功率管理电路按目标层运行相应控制器。降低预算的作用取决于该层原有用量。</li><li><a href="#us11809256b2-fig-2-manage">约束任务获得 CPU 执行机会的频度</a> 任务获得 CPU 执行机会的频度约束对应权利要求中的服务分配。专利未规定调度器内部如何执行。</li><li><a href="#us11809256b2-fig-2-report">回传该层实际功耗</a> 测得或估计的客户端实际功耗供功率反馈环下一轮使用。</li></ol>
