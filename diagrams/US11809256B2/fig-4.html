<p>预算改变后，先判断新上限有没有约束该层需求。只有实际资源用量发生变化，热输入才相应变化。</p>

<ol aria-label="图中机制"><li><a href="#us11809256b2-fig-4-binding">新上限约束需求？</a><span>新预算只有低于该层原可用资源对应的功耗需求，才成为有效限制。</span></li><li><a href="#us11809256b2-fig-4-inactive">预算上限未触发</a><span>后台任务很少时，削减上限可能对实际用量无影响。</span></li><li><a href="#us11809256b2-fig-4-active">限制处理器服务频度</a><span>若预算成为瓶颈，服务频度等执行手段可以压低该层实际用量，但可能增加该层任务的完成时间。</span></li></ol>
