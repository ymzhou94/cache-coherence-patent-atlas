<ol aria-label="图中机制"><li><a href="#us11947457b2-fig-1-preferred">优先供数候选</a> P 主共享承担供数职责。图 16 还按协议把 O／E／M 归入至少主共享。</li><li><a href="#us11947457b2-fig-1-alternate">没有优先候选时检查 S</a> 可以择一个 S 向读方直接发数据。其余 S 的状态变更由读请求的权限决定。</li><li><a href="#us11947457b2-fig-1-others-probe">需要收回权限的其他副本</a> 独占读要求其他持有者失效。共享读允许这些副本继续共享时，控制器可省略相应 snoop。</li></ol>
