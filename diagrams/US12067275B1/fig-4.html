<ol aria-label="图中机制"><li><a href="#us12067275b1-fig-4-req">重配请求</a><span>说明书允许启动时配，也允许在运行时改为新的子域数量。</span></li><li><a href="#us12067275b1-fig-4-busy">旧事务尚未全部退休</a><span>继续依据旧配置处理在途事务。</span></li><li><a href="#us12067275b1-fig-4-empty">TOR 已排空</a><span>第 9 项把排空作为设置新数量之前的操作。</span></li><li><a href="#us12067275b1-fig-4-switch">新数量生效</a><span>以新的配置关系分派随后事务，各状态的切换成本取决于排空。</span></li></ol>
