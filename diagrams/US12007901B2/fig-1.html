<ol aria-label="图中机制"><li><a href="#us12007901b2-fig-1-write-local">局部写只覆盖 d、g、h</a> 控制器使用新写数据覆盖三个槽。原来的 c、e 修改值及其他有效槽保持不变。</li><li><a href="#us12007901b2-fig-1-write-memory">写同样的内存位置</a> 权利要求 1 要求发写请求，覆盖范围和本地相同。写返回或真正生效的时刻不在图 4 给出。</li><li><a href="#us12007901b2-fig-1-validity">更新掩码与标签</a> 按所写位置更新有效性。全有效判定影响掩码后续是否占位。</li></ol>
