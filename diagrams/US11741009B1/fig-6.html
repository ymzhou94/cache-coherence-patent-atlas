<h1>非 FIFO 缓冲如何定位最早的请求</h1>
<p>一级令牌可同时提供缓冲标识和请求 ID。选择器据此从非 FIFO 缓冲取出逻辑上最早的请求。</p>

<ol aria-label="图中机制"><li><a href="#us11741009b1-fig-6-token">一级令牌的可选请求 ID</a> 这是说明书 0031 的非 FIFO 变体。缓冲标识用于定位 B3，请求 ID 定位内部请求。</li><li><a href="#us11741009b1-fig-6-x">令牌指向实际请求 X</a> 请求 Y 也在 B3 中。能发送谁由定序令牌给出的 ID 决定。</li><li><a href="#us11741009b1-fig-6-data">出站走数据通路</a> 令牌值只参与选择。发送端读取实际存放的地址、命令和写负载。</li></ol>
