<body><main>
<h1>解除映射后恢复缓存用途，旧 RAM 地址停止服务</h1>
<p>区分使用方先行保存、解除映射、旧地址读写和普通回填覆盖。</p>
<figure>
<div class="diagram-container" tabindex="0" role="region" aria-label="解除映射后恢复缓存用途，旧 RAM 地址停止服务"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" role="img" aria-labelledby="us11704245b2-fig-5-svg-title us11704245b2-fig-5-svg-desc">
<title id="us11704245b2-fig-5-svg-title">解除映射后恢复缓存用途，旧 RAM 地址停止服务</title>
<desc id="us11704245b2-fig-5-svg-desc">区分使用方先行保存、解除映射、旧地址读写和普通回填覆盖。</desc>
<defs><marker id="us11704245b2-fig-5-arrow-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="us11704245b2-fig-5-arrow-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="us11704245b2-fig-5-arrow-control" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="us11704245b2-fig-5-arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="116" y1="80" x2="116" y2="500" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="358" y1="80" x2="358" y2="500" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="601" y1="80" x2="601" y2="500" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<line x1="844" y1="80" x2="844" y2="500" stroke="#4f5d75" stroke-dasharray="4,6" opacity=".6"/>
<g id="us11704245b2-fig-5-copy"><path d="M 116 120 L 844 120" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us11704245b2-fig-5-arrow-data)"/><rect x="389" y="96" width="182" height="18" fill="#f5f5f5"/><text x="480" y="110" class="arrow-label" text-anchor="middle">仍需要的内容可先由使用方复制</text></g>
<g id="us11704245b2-fig-5-release"><path d="M 116 168 L 358 168" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us11704245b2-fig-5-arrow-main)"/><rect x="159" y="144" width="156" height="18" fill="#f5f5f5"/><text x="237" y="158" class="arrow-label" text-anchor="middle">解除直接 RAM 地址区</text></g>
<g id="us11704245b2-fig-5-restore"><path d="M 358 216 L 601 216" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us11704245b2-fig-5-arrow-main)"/><rect x="382" y="192" width="195" height="18" fill="#f5f5f5"/><text x="479.5" y="206" class="arrow-label" text-anchor="middle">清除对应指示，重新参与缓存操作</text></g>
<g id="us11704245b2-fig-5-direct-read"><path d="M 116 264 L 358 264" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us11704245b2-fig-5-arrow-data)"/><rect x="165.5" y="240" width="143" height="18" fill="#f5f5f5"/><text x="237" y="254" class="arrow-label" text-anchor="middle">解除后到旧地址发读请求</text></g>
<g id="us11704245b2-fig-5-default"><path d="M 358 312 L 116 312" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#us11704245b2-fig-5-arrow-return)"/><rect x="165.5" y="288" width="143" height="18" fill="#f5f5f5"/><text x="237" y="302" class="arrow-label" text-anchor="middle">可返回默认值或报告异常</text></g>
<g id="us11704245b2-fig-5-direct-write"><path d="M 116 360 L 358 360" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#us11704245b2-fig-5-arrow-data)"/><rect x="159" y="336" width="156" height="18" fill="#f5f5f5"/><text x="237" y="350" class="arrow-label" text-anchor="middle">向已解除的地址区发写请求</text></g>
<g id="us11704245b2-fig-5-error"><path d="M 358 408 L 116 408" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#us11704245b2-fig-5-arrow-return)"/><rect x="185" y="384" width="104" height="18" fill="#f5f5f5"/><text x="237" y="398" class="arrow-label" text-anchor="middle">报告无效地址错误</text></g>
<g id="us11704245b2-fig-5-ordinary"><path d="M 358 456 L 601 456" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#us11704245b2-fig-5-arrow-main)"/><rect x="382" y="432" width="195" height="18" fill="#f5f5f5"/><text x="479.5" y="446" class="arrow-label" text-anchor="middle">普通回填可覆盖原 RAM 数据</text></g>
<rect x="28" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="116" y="63" class="node-name" text-anchor="middle">使用方</text>
<rect x="270" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="358" y="63" class="node-name" text-anchor="middle">缓存控制器</text>
<rect x="513" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="601" y="63" class="node-name" text-anchor="middle">所选 way B</text>
<rect x="756" y="32" width="176" height="48" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="844" y="63" class="node-name" text-anchor="middle">系统内存</text>
<text x="28" y="532" class="legend" text-anchor="start">解除本身不会把直接 RAM 内容自动写回。数据需保留时由使用方先复制，具体复制目的地由实现决定。</text>
</svg></div>
<figcaption>依据 US11704245B2 原图 3、4、8、说明书 0048、0052、0053、0054、0057、0086、0087、0088、0089、权利要求 5、6、7、12、13、14、18</figcaption>
</figure>
<ol aria-label="图中机制"><li><a href="#us11704245b2-fig-5-copy">仍需要的数据先复制</a><span>主动复制来自使用方，解除请求本身无写回。</span></li><li><a href="#us11704245b2-fig-5-restore">恢复普通缓存用途</a><span>清除转换指示，选中行重回候选。</span></li><li><a href="#us11704245b2-fig-5-default">读已解除地址</a><span>实施例可返回默认值，也可产生错误。</span></li><li><a href="#us11704245b2-fig-5-error">写已解除地址</a><span>可生成错误或异常，不会向原 RAM 范围更新数据。</span></li></ol>
<details class="component-index"><summary>原图标号对照 <span class="component-count">4 项</span></summary><dl><div><dt>解除直接映射请求</dt><dd>345</dd></div><div><dt>转为直接 RAM 的 way B</dt><dd>240b</dd></div><div><dt>可启用的直接 RAM 地址区 B</dt><dd>215b</dd></div><div><dt>解除映射后访问错误</dt><dd>355</dd></div></dl></details>
</main></body>
